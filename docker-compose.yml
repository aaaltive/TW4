# CasaOS: App Store > Custom Install > import this file, or run `docker compose up -d --build`.
# Put the secrets in a .env file next to this one (never commit it).
# TABLE_PASSCODE plus at least one of the two keys is required.
services:
  ti4:
    build: .
    container_name: ti4-table
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TABLE_PASSCODE: ${TABLE_PASSCODE:?set in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-}
