    });
  }else if(pk.k==='agd'||pk.k==='peek'){
    var used={};G.agenda.laws.forEach(function(l){used[l.id]=1;});G.agenda.done.forEach(function(l){used[l.id]=1;});
    AGD.forEach(function(a){
      if((a[7]&&!G.packs.pok)||(a[8]&&G.packs.pok)||used[a[0]])return;
      if(pk.f&&a[2]!==pk.f)return;

    });

}

/* ---------- damage (sustain damage) ---------- */
function uname(id){var u=UNITS.filter(function(x){return x.id===id;})[0];return u?u.n:id;}
function dmSt(i,pid,uid,pl){
  if(!SUST[uid])return '';
  var s=G.map[i];if(!s)return '';
  var src=pl<0?(s.space[pid]||{}):((((s.planets[pl]||{}).u)||{})[pid]||{});
  if(!src[uid])return '';
  var dm=pl<0?((s.dm||{})[pid]||{}):((((s.planets[pl]||{}).dm)||{})[pid]||{});
  return stepper('Damaged '+uname(uid),dm[uid]||0,'data-act="dm" data-i="'+i+'" data-p="'+pid+'" data-u="'+uid+'" data-pl="'+pl+'"');
}
function fixDm(){
  for(var i in G.map){
    var s=G.map[i];
    if(s.dm)for(var p in s.dm){for(var u in s.dm[p]){var c=((s.space[p]||{})[u])||0;if(s.dm[p][u]>c)s.dm[p][u]=c;if(!s.dm[p][u])delete s.dm[p][u];}if(!Object.keys(s.dm[p]).length)delete s.dm[p];}
    s.planets.forEach(function(pl){if(!pl.dm)return;for(var p in pl.dm){for(var u in pl.dm[p]){var c=(((pl.u||{})[p]||{})[u])||0;if(pl.dm[p][u]>c)pl.dm[p][u]=c;if(!pl.dm[p][u])delete pl.dm[p][u];}if(!Object.keys(pl.dm[p]).length)delete pl.dm[p];}});
  }
}
function dmText(s,pid){
  var o=[];
  var d=(s.dm||{})[pid]||{};for(var u in d)o.push(d[u]+' '+uname(u)+' damaged');
  s.planets.forEach(function(pl){var x=((pl.dm||{})[pid])||{};for(var u in x)o.push(x[u]+' '+uname(u)+' damaged on '+pl.name);});
  return o.join(', ');
}

/* ---------- combat tracker ---------- */
function cbForces(c,pid){
  var s=G.map[c.i]||blankSys();

function cbHasForces(c,pid){

  UNITS.forEach(function(u){if(m[u.id]&&u.k!=='struct')n+=m[u.id];});
  return n>0;
}
function cbSteppers(c,pid){
  var m=cbForces(c,pid),out=[];
  UNITS.forEach(function(u){
    if(!packOk(u)||!m[u.id])return;
    if(c.pl===null){if(u.k==='struct')return;out.push(stepper(u.n,m[u.id],'data-act="su" data-i="'+c.i+'" data-p="'+pid+'" data-u="'+u.id+'"')+dmSt(c.i,pid,u.id,-1));}
    else{if(u.k==='space')return;out.push(stepper(u.n,m[u.id],'data-act="gu" data-i="'+c.i+'" data-pl="'+c.pl+'" data-p="'+pid+'" data-u="'+u.id+'"')+dmSt(c.i,pid,u.id,c.pl));}
  });

function cbLabel(c){var s=G.map[c.i]||blankSys();return c.pl===null?'space':(s.planets[c.pl]?s.planets[c.pl].name:'planet');}
function applyHitsTo(c,pid,a){
  var s=ens(c.i),tgt,dmo,pl;
  if(c.pl===null){s.space[pid]=s.space[pid]||{};tgt=s.space[pid];s.dm=s.dm||{};s.dm[pid]=s.dm[pid]||{};dmo=s.dm[pid];}
  else{pl=s.planets[c.pl];pl.u=pl.u||{};pl.u[pid]=pl.u[pid]||{};tgt=pl.u[pid];pl.dm=pl.dm||{};pl.dm[pid]=pl.dm[pid]||{};dmo=pl.dm[pid];}
  var done=[],sus=a.sustain||{},des=a.destroy||{};
  Object.keys(sus).forEach(function(u){if(!SUST[u])return;var n=Math.min(+sus[u]||0,(tgt[u]||0)-(dmo[u]||0));if(n>0){dmo[u]=(dmo[u]||0)+n;done.push('sustained '+n+' '+uname(u));}});
  Object.keys(des).forEach(function(u){var n=Math.min(+des[u]||0,tgt[u]||0);if(n>0){tgt[u]-=n;if(!tgt[u])delete tgt[u];if((dmo[u]||0)>(tgt[u]||0))dmo[u]=tgt[u]||0;if(!dmo[u])delete dmo[u];done.push('lost '+n+' '+uname(u));}});
  if(c.pl===null){if(!Object.keys(tgt).length)delete s.space[pid];if(!Object.keys(dmo).length)delete s.dm[pid];}
  else{if(!Object.keys(tgt).length)delete pl.u[pid];if(!Object.keys(dmo).length)delete pl.dm[pid];}
  return done.join(', ')||'nothing changed';
}

function adjacent(slot){

    var d=(Math.abs(p.q-q.q)+Math.abs(p.r-q.r)+Math.abs((p.q+p.r)-(q.q+q.r)))/2;
    if(d===1)out.push(q.i);

function parseJSON(t){var a=String(t).indexOf('{'),b=String(t).lastIndexOf('}');if(a<0||b<=a)return null;try{return JSON.parse(String(t).slice(a,b+1));}catch(e){return null;}}
function errText(e){

  if(c==='cancelled')return 'Stopped.';

async function claudeCall(kind,msg,tier){

      if(pk.k==='peek'){pk.sel=pk.sel||[];var pix=pk.sel.indexOf(d.id);if(pix>=0)pk.sel.splice(pix,1);else if(pk.sel.length<2)pk.sel.push(d.id);return 2;}
      if(pk.k==='obj'){G.obj.pub.push({id:d.id,by:[],r:G.round});deckRemove('ob',d.id);log('Revealed objective: '+OBJM[d.id][1]);}
      else if(pk.k==='agd'){G.agenda.cur={id:d.id};deckRemove('ag',d.id);log('Agenda drawn: '+AGDM[d.id][1]);}
      else if(pk.k==='tech'){var t=TECHM[d.id],pp=P(pk.p);if(t&&pp){pp.techs.push({n:t[1],c:t[3],ex:false});log(pp.name+' researched '+t[1]);}}
      ui.picker=null;return 1;
    case 'objScore':
      o=G.obj.pub[+d.o];p=P(d.p);m=OBJM[o.id];i=o.by.indexOf(d.p);
      if(i<0){o.by.push(d.p);p.vp+=m[4];log(p.name+' scored '+m[1]+' (+'+m[4]+' VP)');}
      else{o.by.splice(i,1);p.vp=Math.max(0,p.vp-m[4]);log(p.name+' no longer scores '+m[1]+' (−'+m[4]+' VP)');}
      return 1;
    case 'objDel':
      o=G.obj.pub[+d.o];m=OBJM[o.id];
      o.by.forEach(function(pid){var q=P(pid);if(q)q.vp=Math.max(0,q.vp-m[4]);});
      G.obj.pub.splice(+d.o,1);log('Removed objective '+m[1]);return 1;
    case 'agdResolve':
      if(!G.agenda.cur)return 0;
      var ag=AGDM[G.agenda.cur.id],inp=$('#agd-out'),out=(inp?inp.value:'').trim();
      if(ag[2]==='L')G.agenda.laws.push({id:ag[0],out:out});else G.agenda.done.push({id:ag[0],out:out,r:G.round});
      log('Agenda resolved: '+ag[1]+(out?' ('+out+')':'')+(ag[2]==='L'?', now a law':', directive'));
      G.agenda.cur=null;return 1;
    case 'agdCancel':if(G.agenda.cur&&hGet()&&G.agdMode==='app'&&hGet().ag.deck.indexOf(G.agenda.cur.id)<0){hGet().ag.deck.push(G.agenda.cur.id);hSave();ui.noUndo=true;ui.undo=[];}G.agenda.cur=null;return 1;
    case 'lawDel':
      var l=G.agenda.laws.splice(+d.i,1)[0];if(l){G.agenda.done.push({id:l.id,out:'repealed',r:G.round});log('Law repealed: '+(AGDM[l.id]?AGDM[l.id][1]:l.id));}
      return 1;
    case 'dm':
      s=ens(+d.i);var pl=+d.pl,src,dmo;
      if(pl<0){src=s.space[d.p]||{};s.dm=s.dm||{};dmo=s.dm;}
      else{var plt=s.planets[pl];src=((plt.u||{})[d.p])||{};plt.dm=plt.dm||{};dmo=plt.dm;}
      dmo[d.p]=dmo[d.p]||{};
      var nv=Math.max(0,Math.min(src[d.u]||0,(dmo[d.p][d.u]||0)+(+d.d)));
      if(nv)dmo[d.p][d.u]=nv;else delete dmo[d.p][d.u];
      return 1;
    case 'cbOpen':
      i=+d.i;s=G.map[i];if(!s)return 0;
      var present=G.players.filter(function(q){return sum(s.space[q.id])||s.planets.some(function(x){return sum((x.u||{})[q.id]);});});
      if(present.length<2){toast('Combat needs forces from two players in this system. Add them first.');return 2;}
      closeSheet();
      var withShips=G.players.filter(function(q){var mm=s.space[q.id]||{};return UNITS.some(function(u){return u.k==='space'&&mm[u.id];});});
      var gpl=null;
      if(withShips.length<2)s.planets.forEach(function(x,ix){if(gpl===null&&G.players.filter(function(q){var mm=(x.u||{})[q.id]||{};return mm.infantry||mm.mech;}).length>=2)gpl=ix;});
      var A=present.filter(function(q){return q.id===G.active;})[0]||present[0],D=present.filter(function(q){return q.id!==A.id;})[0];
      ui.combat={i:i,pl:gpl,a:A.id,d:D.id,round:1,ha:0,hd:0,busy:false,msg:'',hmsg:'',retreat:null,retreating:null,before:clone(s)};
      cl=claudeP();
      if(cl&&(cl.id===A.id||cl.id===D.id)&&ui.sample&&hGet())setTimeout(cbAskRetreat,0);
      return 1;
    case 'cbEnd':cbEnd();return 1;
    case 'cbBackdrop':return 0;
    case 'cbHit':c=ui.combat;if(d.s==='a')c.ha=Math.max(0,c.ha+(+d.d));else c.hd=Math.max(0,c.hd+(+d.d));return 2;
    case 'cbRecord':cbRecord();return 0;
    case 'cbAskRetreat':cbAskRetreat();return 0;
    case 'cbMove':cbMove();return 0;
    case 'cStop':if(ui.abort)ui.abort.abort();return 0;
    case 'cDeal':setupCards();return 1;
    case 'cDraw':
      if(!hGet())return 0;hDraw(d.k,1);hSave();hSync();
      log('Claude drew '+(d.k==='ac'?'an action card':'a secret objective'));ui.undo=[];return 1;
    case 'cAsk':askClaude(d.k,'');return 0;
    case 'cSend':
      var mi=$('#cl-msg'),txt=mi?mi.value.trim():'';if(!txt)return 0;
      log('Table talk to Claude: '+txt);askClaude('free',txt);return 0;
    case 'cApply':applyCR();return 1;
    case 'apiSave':case 'apiClear':case 'apiTest':apiAct(a);return 2;
    case 'clearLog':
      if(ui.arm!=='clearLog'){ui.arm='clearLog';clearTimeout(act.t);act.t=setTimeout(function(){ui.arm=null;render();},4000);return 2;}
      ui.arm=null;G.log=[];toast('Log cleared. Undo brings it back.');return 1;
    case 'alertOk':ui.alert=null;return 2;
    case 'alertBackdrop':if(ev&&el===ev.target){ui.alert=null;return 2;}return 0;
    case 'cDismiss':ui.cr=null;return 2;
    case 'hdrClaude':
      if(!hGet()){ui.tab='claude';ui.resetY=true;return 2;}
      if(G.phase==='strategy'){claudePickStrategy();return 0;}
      ui.tab='claude';ui.resetY=true;askClaude({action:'turn',status:'status',agenda:'agenda',setup:'setup'}[G.phase],'');return 0;
    case 'pbAdd':
      var pt=$('#pb-t'),pg=$('#pb-g'),tx=pt?pt.value.trim():'';if(!tx)return 0;
      var tg=(pg?pg.value:'general').split(',').map(function(x){return x.trim().toLowerCase();}).filter(Boolean);
      PB.lessons.push({t:tx,tags:tg.length?tg:['general']});pbSave();return 2;
    case 'pbDel':PB.lessons.splice(+d.i,1);pbSave();return 2;
    case 'pbImport':
      var pi=$('#pb-i'),n=0;if(!pi)return 0;
      pi.value.split('\n').forEach(function(line){
        line=line.trim();if(!line)return;
        var k=line.indexOf('|'),tags=k>=0?line.slice(0,k).split(',').map(function(x){return x.trim().toLowerCase();}).filter(Boolean):['general'],text=(k>=0?line.slice(k+1):line).trim();
        if(text){PB.lessons.push({t:text,tags:tags.length?tags:['general']});n++;}
      });
      pbSave();toast(n+' lesson'+(n===1?'':'s')+' imported.');return 2;
    case 'dbMake':ui.debrief=debriefText();return 2;
    case 'dbCopy':
      var dt=$('#db-t');
      try{navigator.clipboard.writeText(dt?dt.value:ui.debrief).then(function(){toast('Copied.');render();},function(){toast('Select the text and copy it by hand.');render();});}catch(e){toast('Select the text and copy it by hand.');}
      return 0;
  }
  return 0;
}

async function claudePickStrategy(){

/* ---------- strategy phase order ---------- */
function stratNeed(){return G.players.length<=4?2:1;}
function heldN(pid){var k=0;for(var n=1;n<=8;n++)if(G.strat[n].pid===pid)k++;return k;}
function nextPicker(){
  var need=stratNeed(),ord=seatsFromSpeaker();
  for(var pass=1;pass<=need;pass++)for(var i=0;i<ord.length;i++)if(heldN(ord[i])<pass)return ord[i];
  return null;
}
function stratAdvance(){
  if(G.phase!=='strategy')return;
  var nx=nextPicker();
  if(nx){G.active=nx;return;}
  setPhase('action');
  toast('Strategy phase complete. The action phase begins with '+(G.active?pn(G.active):'the first player')+'.');
}


/* ====================== cards for every player, deck handling, turn confirmation ====================== */
function freshOb(){
  var o={1:[],2:[]};
  OBJ.forEach(function(x){
    if(x[2]!==1&&x[2]!==2)return;if(x[6]&&!G.packs.pok)return;
    if(G.obj.pub.some(function(q){return q.id===x[0];}))return;
    o[x[2]].push(x[0]);
  });
  shuffle(o[1]);shuffle(o[2]);return o;
}
function freshAg(){
  var a=[];
  AGD.forEach(function(x){
    if((x[7]&&!G.packs.pok)||(x[8]&&G.packs.pok))return;
    if(G.agenda.laws.some(function(l){return l.id===x[0];})||G.agenda.done.some(function(l){return l.id===x[0];})||(G.agenda.cur&&G.agenda.cur.id===x[0]))return;
    a.push(x[0]);
  });
  return shuffle(a);
}
function hFix(h){h.hands=h.hands||{};if(!h.ob)h.ob=freshOb();if(!h.ag)h.ag={deck:freshAg(),disc:[]};return h;}
function handOf(pid){
  var cp=claudeP();
  if(cp&&pid===cp.id)return {ac:H.ac.hand,so:H.so.hand,scored:H.so.scored,pending:H.so.pending};
  if(!H.hands[pid])H.hands[pid]={ac:[],so:[],scored:[],pending:[]};
  return H.hands[pid];
}
function drawTo(pid,k,n){
  var d=H[k],hd=handOf(pid)[k];
  for(var i=0;i<n;i++){
    if(!d.deck.length&&d.disc&&d.disc.length){d.deck=shuffle(d.disc);d.disc=[];}
    if(!d.deck.length)break;
    hd.push(d.deck.pop());
  }
}
function deckRemove(kind,id){
  var hh=hGet();if(!hh)return;
  var arr=kind==='ag'?hh.ag.deck:hh.ob[OBJM[id]?OBJM[id][2]:0];
  var i=arr?arr.indexOf(id):-1;
  if(i>=0){arr.splice(i,1);hSave();ui.noUndo=true;ui.undo=[];}
}
function setupCards(){
  hInit();
  G.players.forEach(function(p){var hd=handOf(p.id);hd.pending.length=0;for(var i=0;i<2;i++){var id=H.so.deck.pop();if(id)hd.pending.push(id);}});
  hSync();hSave();
  log('Card decks shuffled and opening secret objectives dealt to every player');
  if(G.phase==='setup')G.active=G.speaker||(G.players[0]&&G.players[0].id)||null;
  ui.undo=[];ui.show=null;
}

function arrangeAgenda(top,bottom){

  bottom.forEach(function(id){dk.unshift(id);});

async function claudeArrange(){

}

function askDone(){
  var a=G.active;
  if(!a&&G.phase==='setup'){ui.confirm={t:'Start the strategy phase?',m:'Setup is finished.',ok:'Start strategy phase',act:'endTurn'};render();return;}
  if(!a){toast('Choose whose turn it is first by tapping a name.');render();return;}
  var c;
  if(G.phase==='strategy'){
    var nx=nextPicker();
    if(nx===a){ui.alert={t:'Pick strategy cards first',m:'Players need to pick strategy cards before the strategy phase can end. '+pn(a)+' still needs to pick (card '+(heldN(a)+1)+' of '+stratNeed()+').'};render();return;}
    c=nx?{t:'End '+pn(a)+'’s turn?',m:'Next to pick a strategy card: '+pn(nx)+'.',ok:'End turn'}:{t:'Start the action phase?',m:'Everyone has chosen their strategy cards.',ok:'Start action phase'};
  }else if(G.phase==='action'){
    var all=G.players.every(function(q){return q.passed;});
    c=all?{t:'Start the status phase?',m:'Everyone has passed.',ok:'Start status phase'}:{t:'End '+pn(a)+'’s turn?',m:P(a)&&P(a).passed?pn(a)+' has passed.':'Tap Pass first if '+pn(a)+' is passing for the rest of this phase.',ok:'End turn'};
  }else if(G.phase==='setup'&&order().indexOf(a)===order().length-1){c={t:'Start the strategy phase?',m:'Everyone has finished setting up.',ok:'Start strategy phase'};}else c={t:'End '+pn(a)+'’s turn?',m:'',ok:'End turn'};
  c.act='endTurn';ui.confirm=c;render();
}
function endTurn(){
  if(G.phase==='setup'){var os=order();if(!G.active||os.indexOf(G.active)===os.length-1){setPhase('strategy');toast('The strategy phase begins with '+(G.active?pn(G.active):'the speaker')+'.');return;}}
  if(G.phase==='strategy'){
    var nx=nextPicker();
    if(!nx){setPhase('action');toast('The action phase begins with '+(G.active?pn(G.active):'the first player')+'.');}
    else G.active=nx;
    return;
  }
  advance(false);
}

function rollD10(){
  var c=window.crypto||window.msCrypto;
  if(c&&c.getRandomValues){
    var a=new Uint32Array(1),lim=Math.floor(4294967296/10)*10;   // reject the uneven tail so every face is equally likely
    do{c.getRandomValues(a);}while(a[0]>=lim);
    return a[0]%10+1;
  }
  return Math.floor(Math.random()*10)+1;
}

/* ---------- routes ---------- */
function tacCtx(pid,t,o){o=o||{};return {pid:pid,t:t,bonus:o.bonus||0,noAnom:!!o.noAnom,thru:!!o.thru,cache:{}};}
function tacRoute(cx,o,mv){
  var key=o+'|'+mv;if(cx.cache[key])return cx.cache[key];
  var os=G.map[o]||blankSys(),ts=G.map[cx.t]||blankSys(),anti=hasTech(cx.pid,'Antimass Deflectors');
  var m=mv;if(os.type==='nebula'&&!cx.noAnom)m=1;
  var res={ok:false,sys:{},minSteps:99,anyNoRift:false,riftReq:false};
  if(!cx.noAnom&&(ts.type==='supernova'||(ts.type==='asteroid'&&!anti))){cx.cache[key]=res;return res;}
  var maxLen=m+cx.bonus+1,path=[o];
  function blocked(x){
    var xs=G.map[x]||blankSys();
    if(!cx.noAnom&&(xs.type==='supernova'||xs.type==='nebula'||(xs.type==='asteroid'&&!anti)))return true;
    if(!cx.thru&&enemyBlocks(x,cx.pid))return true;
    return false;
  }
  function dfs(cur,len){
    if(cur===cx.t){
      var steps=path.length-1,rift=!cx.noAnom&&(os.type==='rift'||path.slice(1,-1).some(function(x){var xs=G.map[x];return xs&&xs.type==='rift';}));
      if(steps<=m+cx.bonus+(rift?1:0)){res.ok=true;path.forEach(function(x){res.sys[x]=1;});res.minSteps=Math.min(res.minSteps,steps);if(!rift)res.anyNoRift=true;}
      return;
    }
    if(len>=maxLen)return;
    nbrs(cur).forEach(function(x){
      if(path.indexOf(x)>=0)return;
      if(x!==cx.t&&blocked(x))return;
      path.push(x);dfs(x,len+1);path.pop();
    });
  }
  if(o!==cx.t)dfs(o,0);
  res.riftReq=res.ok&&!res.anyNoRift;
  cx.cache[key]=res;return res;
}

function tacOrigins(pid,t){

    var has=sum(s.space[pid])>0||s.planets.some(function(pl){var u=(pl.u||{})[pid]||{};return (u.infantry||0)+(u.mech||0)>0;});
    if(has)out.push({slot:k,token:s.cmd.indexOf(pid)>=0});
  });

}
function tacAvail(pid,o){
  var s=G.map[o],sp=s.space[pid]||{},ships={},cargo={},planets={};
  Object.keys(sp).forEach(function(u){if(isShip(pid,u))ships[u]=sp[u];else if(isCargo(pid,u))cargo[u]=sp[u];});
  s.planets.forEach(function(p,ix){var g=(p.u||{})[pid]||{},c={};['infantry','mech'].forEach(function(u){if(g[u])c[u]=g[u];});if(Object.keys(c).length)planets[ix]=c;});
  return {ships:ships,cargo:cargo,planets:planets};
}
function tacCanReach(cx,o,uid){var st=ustat(cx.pid,uid);return !!st&&tacRoute(cx,o,st.mv).ok;}

/* ---------- capacity ---------- */
function maxFlow(demand,prov){
  var ds=Object.keys(demand),nD=ds.length,nP=prov.length,N=2+nD+nP,S=0,T=N-1,cap=[],i,j;
  for(i=0;i<N;i++){cap.push([]);for(j=0;j<N;j++)cap[i].push(0);}
  ds.forEach(function(k,a){cap[S][1+a]=demand[k];prov.forEach(function(p,b){if(p.sys[k])cap[1+a][1+nD+b]=1e9;});});
  prov.forEach(function(p,b){cap[1+nD+b][T]=p.cap;});
  var flow=0;
  for(;;){
    var par=[];for(i=0;i<N;i++)par.push(-1);par[S]=S;var q=[S];
    while(q.length&&par[T]<0){var u=q.shift();for(var v=0;v<N;v++)if(par[v]<0&&cap[u][v]>0){par[v]=u;q.push(v);}}
    if(par[T]<0)break;
    var f=1e9,w=T;while(w!==S){f=Math.min(f,cap[par[w]][w]);w=par[w];}
    w=T;while(w!==S){cap[par[w]][w]-=f;cap[w][par[w]]+=f;w=par[w];}
    flow+=f;
  }
  return flow;
}
function tacCapCheck(cx,moves){
  var pid=cx.pid,demand={},prov=[],total=0,capAll=0;
  Object.keys(moves).forEach(function(o0){
    var o=+o0,m=moves[o0];
    Object.keys(m.u||{}).forEach(function(u){
      var n=m.u[u];if(!n)return;
      if(isCargo(pid,u))demand[o]=(demand[o]||0)+n;
      else if(isShip(pid,u)){var st=ustat(pid,u);if(st.cap>0){var r=tacRoute(cx,o,st.mv);capAll+=st.cap*n;prov.push({cap:st.cap*n,sys:r.ok?r.sys:{}});}}
    });
    Object.keys(m.p||{}).forEach(function(ix){Object.keys(m.p[ix]).forEach(function(u){var n=m.p[ix][u];if(n)demand[o]=(demand[o]||0)+n;});});
  });
  Object.keys(demand).forEach(function(k){total+=demand[k];});
  var flow=total?maxFlow(demand,prov):0;
  return {ok:flow>=total,need:total,cap:capAll,flow:flow};
}
function capMessage(r){
  return 'Not enough capacity. You are moving '+r.need+' fighter'+(r.need===1?'':'s')+' and ground force'+(r.need===1?'':'s')+', but the ships you are moving can carry only '+r.flow+' of them from the systems those ships start in or pass through.';
}

/* ---------- fleet count ---------- */
function fleetAt(pid,slot,moves,t){
  var s=G.map[slot],n=s?shipsCount(s,pid):0;
  if(slot!==t){var m=moves[slot];if(m)Object.keys(m.u||{}).forEach(function(u){if(isShip(pid,u)&&u!=='ffactory')n-=m.u[u];});}
  else Object.keys(moves).forEach(function(o){var m=moves[o];Object.keys(m.u||{}).forEach(function(u){if(isShip(pid,u)&&u!=='ffactory')n+=m.u[u];});});
  return n;
}

/* ---------- activating and moving ---------- */
function tacActivateCheck(pid,t){
  var s=G.map[t],p=P(pid);
  if(!p)return 'No player is taking a turn.';
  if(!s||!s.tile)return 'That slot has no tile.';
  if(p.cmd.t<1)return p.name+' has no command tokens in the tactic pool, so they cannot activate a system.';
  if(s.cmd.indexOf(pid)>=0)return p.name+' already has a command token in this system, so it cannot be activated again.';
  return '';
}
function tacPlaceToken(pid,t){var p=P(pid),s=ens(t);p.cmd.t-=1;s.cmd.push(pid);}
function tacRefundToken(pid,t){var p=P(pid),s=G.map[t];if(!s)return;var i=s.cmd.indexOf(pid);if(i>=0){s.cmd.splice(i,1);p.cmd.t+=1;}}
function tacCheckMoves(cx,moves){
  var pid=cx.pid;
  for(var o0 in moves){
    var o=+o0,s=G.map[o],m=moves[o0];
    if(!s)return 'Slot '+o+' does not exist.';
    if(o===cx.t)return 'Units cannot move from the active system into itself.';
    if(s.cmd.indexOf(pid)>=0)return 'Units cannot move out of slot '+o+', because it contains one of '+pn(pid)+'’s command tokens.';
    var av=tacAvail(pid,o);
    for(var u in (m.u||{})){
      var n=m.u[u];if(!n)continue;
      if(isShip(pid,u)){
        if(n>(av.ships[u]||0))return 'Slot '+o+' has only '+(av.ships[u]||0)+' '+uname(u)+', not '+n+'.';
        if(!tacCanReach(cx,o,u))return 'A '+uname(u)+' in slot '+o+' cannot reach slot '+cx.t+' with its move value.';
      }else if(isCargo(pid,u)){
        if(n>(av.cargo[u]||0))return 'Slot '+o+' has only '+(av.cargo[u]||0)+' '+uname(u)+' in space, not '+n+'.';
      }else return uname(u)+' cannot move.';
    }
    for(var ix in (m.p||{})){
      for(var u2 in m.p[ix]){var n2=m.p[ix][u2];if(!n2)continue;
        if(n2>((av.planets[ix]||{})[u2]||0))return 'That planet in slot '+o+' has fewer '+uname(u2)+' than '+n2+'.';}
    }
  }
  var cap=tacCapCheck(cx,moves);
  if(!cap.ok)return capMessage(cap);
  return '';
}
function tacApplyMoves(pid,t,moves){
  var ts=ens(t),lines=[];
  ts.space[pid]=ts.space[pid]||{};ts.dm=ts.dm||{};
  function take(src,dmo,u,n){
    var have=src[u]||0;n=Math.min(n,have);if(!n)return {n:0,dam:0};
    var dam=(dmo&&dmo[u])||0,moveDam=Math.max(0,dam-(have-n));
    src[u]=have-n;if(!src[u])delete src[u];
    if(dmo&&dam){dmo[u]=dam-moveDam;if(!dmo[u])delete dmo[u];}
    return {n:n,dam:moveDam};
  }
  function give(u,r){
    if(!r.n)return;
    ts.space[pid][u]=(ts.space[pid][u]||0)+r.n;
    if(r.dam){ts.dm[pid]=ts.dm[pid]||{};ts.dm[pid][u]=(ts.dm[pid][u]||0)+r.dam;}
  }
  Object.keys(moves).forEach(function(o0){
    var o=+o0,os=ens(o),m=moves[o0],parts=[];
    os.space[pid]=os.space[pid]||{};os.dm=os.dm||{};os.dm[pid]=os.dm[pid]||{};
    Object.keys(m.u||{}).forEach(function(u){var r=take(os.space[pid],os.dm[pid],u,m.u[u]);if(r.n){give(u,r);parts.push(r.n+' '+uname(u));}});
    Object.keys(m.p||{}).forEach(function(ix){
      var pl=os.planets[+ix];if(!pl)return;pl.u=pl.u||{};pl.u[pid]=pl.u[pid]||{};pl.dm=pl.dm||{};pl.dm[pid]=pl.dm[pid]||{};
      Object.keys(m.p[ix]).forEach(function(u){var r=take(pl.u[pid],pl.dm[pid],u,m.p[ix][u]);if(r.n){give(u,r);parts.push(r.n+' '+uname(u)+' from '+pl.name);}});
      if(!Object.keys(pl.u[pid]).length)delete pl.u[pid];if(!Object.keys(pl.dm[pid]).length)delete pl.dm[pid];
    });
    if(!Object.keys(os.space[pid]).length)delete os.space[pid];
    if(!Object.keys(os.dm[pid]).length)delete os.dm[pid];
    if(parts.length)lines.push('slot '+o+': '+parts.join(', '));
  });
  if(!Object.keys(ts.dm[pid]||{}).length)delete ts.dm[pid];
  return lines;
}
function tacRiftShips(cx,moves){
  var n=0;
  Object.keys(moves).forEach(function(o0){var m=moves[o0];Object.keys(m.u||{}).forEach(function(u){if(isShip(cx.pid,u)&&m.u[u]){var st=ustat(cx.pid,u),r=tacRoute(cx,+o0,st.mv);if(r.riftReq)n+=m.u[u];}});});
  return n;
}

/* ---------- Claude's structured tactical action ---------- */
function tacParse(pid,tac){
  var out={t:+tac.activate,moves:{},bonus:Math.max(0,Math.min(3,Math.floor(+tac.movement_bonus||0))),err:''};
  if(!(out.t>=0)||!G.map[out.t]){out.err='The slot to activate ('+tac.activate+') is not on the map.';return out;}
  (tac.moves||[]).forEach(function(mv){
    if(out.err)return;
    var o=+mv.from,s=G.map[o];
    if(!s){out.err='Slot '+mv.from+' is not on the map.';return;}
    var cur=out.moves[o]||(out.moves[o]={u:{},p:{}});
    Object.keys(mv.units||{}).forEach(function(u){var n=Math.floor(+mv.units[u]||0);if(n>0)cur.u[u]=(cur.u[u]||0)+n;});
    Object.keys(mv.planet_units||{}).forEach(function(name){
      var ix=-1;s.planets.forEach(function(pl,i){if(pl.name.toLowerCase()===String(name).toLowerCase())ix=i;});
      if(ix<0){out.err='Slot '+o+' has no planet called '+name+'.';return;}
      var cur2=cur.p[ix]||(cur.p[ix]={});
      Object.keys(mv.planet_units[name]).forEach(function(u){var n=Math.floor(+mv.planet_units[name][u]||0);if(n>0)cur2[u]=(cur2[u]||0)+n;});
    });
  });
  out.commit=[];
  (tac.commit||[]).forEach(function(cm){
    var nm=String((cm&&cm.planet)||'').toLowerCase(),ix=-1;
    (G.map[out.t]&&G.map[out.t].planets||[]).forEach(function(pl,k){if(pl.name.toLowerCase()===nm)ix=k;});
    if(ix<0){out.err=out.err||'Slot '+out.t+' has no planet called '+((cm&&cm.planet)||'(none)')+' to land on.';return;}
    var u={};['infantry','mech'].forEach(function(k){var n=Math.floor(+((cm.units||{})[k])||0);if(n>0)u[k]=n;});
    if(!Object.keys(u).length)return;
    out.commit.push({ix:ix,units:u});
  });
  return out;
}
function tacCheckClaude(cp,tac){
  var pr=tacParse(cp.id,tac);if(pr.err)return pr.err;
  var e=tacActivateCheck(cp.id,pr.t);if(e)return e;
  if(G.phase!=='action')return 'A tactical action can only be taken in the action phase.';
  var cx=tacCtx(cp.id,pr.t,{bonus:pr.bonus});
  // the token goes in first, so units may not leave the active system itself
  return tacCheckMoves(cx,pr.moves);
}
function tacRunClaude(cp,tac){
  var pr=tacParse(cp.id,tac);
  tacPlaceToken(cp.id,pr.t);G.tac={slot:pr.t,pid:cp.id};ui.claudeCommit=(pr.commit||[]).slice();
  var lines=tacApplyMoves(cp.id,pr.t,pr.moves),s=G.map[pr.t];
  log(cp.name+' activated slot '+pr.t+' (tile '+s.tile+')'+(lines.length?' and moved: '+lines.join('; '):''));
  var cx=tacCtx(cp.id,pr.t,{bonus:pr.bonus}),rift=tacRiftShips(cx,pr.moves);
  if(rift)ui.alert={t:'Gravity rift',m:'About '+rift+' of Claude’s ships moved through or out of a gravity rift. Roll one die for each of them: on a 1, 2 or 3 the ship is destroyed.'};
  return pr;
}
function tacDescribe(tac){
  var pr=tacParse(claudeP()?claudeP().id:'',tac);if(pr.err)return [pr.err];
  var o=['Activate slot '+pr.t+' (tile '+((G.map[pr.t]||{}).tile||'?')+'), placing a command token from the tactic pool.'];
  Object.keys(pr.moves).forEach(function(k){
    var m=pr.moves[k],parts=[];
    Object.keys(m.u).forEach(function(u){parts.push(m.u[u]+' '+uname(u));});
    Object.keys(m.p).forEach(function(ix){var pl=(G.map[+k].planets||[])[+ix];Object.keys(m.p[ix]).forEach(function(u){parts.push(m.p[ix][u]+' '+uname(u)+' from '+(pl?pl.name:'a planet'));});});
    if(parts.length)o.push('Move from slot '+k+' to slot '+pr.t+': '+parts.join(', ')+'.');
  });
  (pr.commit||[]).forEach(function(cm){var pl=(G.map[pr.t]||{}).planets[cm.ix];if(pl)o.push('After space combat, commit '+Object.keys(cm.units).map(function(k){return cm.units[k]+' '+uname(k);}).join(', ')+' to '+pl.name+'.');});
  if(pr.bonus)o.push('Movement bonus of +'+pr.bonus+' applies to every ship.');
  return o;
}

function tacAfter(pid,t){

  var opps=G.players.filter(function(q){return q.id!==pid&&(hasShips(s,q.id)||s.planets.some(function(pl){return (((pl.u||{})[q.id]||{}).pds||0)>0;}));});
  if(!opps.length)return false;
  ui.pre={i:t,a:pid,defs:opps.map(function(q){return q.id;}),queue:[pid].concat(opps.map(function(q){return q.id;})),idx:0,played:[],busy:false};

/* ====================== combat: dice rows per unit type, history, round flow ====================== */
function hasShips(s,pid){var m=s.space[pid]||{};return UNITS.some(function(u){return u.k==='space'&&u.id!=='ffactory'&&!(isCargo(pid,u.id)&&u.id!=='fighter')&&m[u.id]>0;});}
function cbBlank(){return {a:{},d:{},pa:{},pd:{}};}
function cbStartVs(i,a,defs,played){cbStart(i,a,defs[0],{played:played||[],queue:defs.slice(1)});}
function cbResetRolls(c){
  c.res=cbBlank();c.ov=cbBlank();c.xa=0;c.xd=0;c.ha=0;c.hd=0;c.ret={a:null,d:null};c.rd={a:false,d:false};
  var s=G.map[c.i]||blankSys();c.noSpace=c.pl===null?!(hasShips(s,c.a)&&hasShips(s,c.d)):false;
}
function cbSideRows(c,side){
  var pid=side==='a'?c.a:c.d,m=cbForces(c,pid),rows=[];
  UNITS.forEach(function(u){
    var n=m[u.id]||0;if(!n)return;
    if(c.pl===null){if(u.k!=='space'||u.id==='ffactory'||isCargo(pid,u.id)&&u.id!=='fighter')return;}
    else if(u.k!=='ground')return;
    var st=ustat(pid,u.id);if(!st||st.com==null)return;
    var neb=c.pl===null&&side==='d'&&(G.map[c.i]||{}).type==='nebula',ov=(c.ov[side]||{})[u.id]||{},base={dice:n*(st.dice||1),on:neb?Math.max(1,st.com-1):st.com};
    rows.push({u:u.id,name:u.n,n:n,dice:ov.dice!=null?ov.dice:base.dice,on:ov.on!=null?ov.on:base.on,note:neb?'Nebula: the defender applies +1 to combat rolls, so it hits on one lower.':'',res:(c.res[side]||{})[u.id]||null});
  });
  return rows;
}
function cbPreRows(c,side){
  if(c.round!==1)return [];
  var pid=side==='a'?c.a:c.d,m=cbForces(c,pid),s=G.map[c.i]||blankSys(),rows=[],key='p'+side;
  function mk(k,name,n,dice,on,note){var ov=(c.ov[key]||{})[k]||{};rows.push({k:k,name:name,n:n,dice:ov.dice!=null?ov.dice:dice,on:ov.on!=null?ov.on:on,note:note,res:(c.res[key]||{})[k]||null});}
  if(c.pl!==null){cbGroundPre(c,side,mk);return rows;}
  var dn=m.destroyer||0;if(dn){var ds=ustat(pid,'destroyer');if(ds.afb)mk('afb','Anti-fighter barrage (Destroyer)',dn,dn*ds.afb[1],ds.afb[0],'Hits can only destroy fighters.');}
  {var pn2=0;s.planets.forEach(function(pl){pn2+=(((pl.u||{})[pid]||{}).pds||0);});if(pn2){var ps=ustat(pid,'pds');mk('sc','Space cannon (PDS)',pn2,pn2*ps.sc[1],ps.sc[0],'Hits can destroy any ship.');}}
  return rows;
}
function cbHitsOf(rows){var h=0;rows.forEach(function(r){if(r.res)h+=r.res.hits;});return h;}
function cbSync(c){if(c.pl===null&&c.noSpace){c.ha=c.xa;c.hd=c.xd;return;}c.ha=cbHitsOf(cbSideRows(c,'a'))+c.xa;c.hd=cbHitsOf(cbSideRows(c,'d'))+c.xd;}
async function cbAskCards(){
  var c=ui.combat,cl=claudeP();if(!c||!cl||c.busy)return;

    var r=await claudeCall('precombat','','quick'),d=r.data;if(!d)throw {code:'bad_json'};

    cbSetNotes(d);c.hmsg=(d.say||'Claude plays no action cards.');
    if(d.play_action_cards&&d.play_action_cards.length)ui.alert={t:'Claude plays an action card',m:d.play_action_cards.map(function(id){var a=ACTM[id];return a?a[1]+': '+a[3]:'';}).join(' ')};
  }catch(e){c.hmsg='Could not ask Claude about action cards. '+errText(e);}

}
function cbEnd(){
  var c=ui.combat,a=G.map[c.i]||blankSys(),d=diffSys(c.before,a);

function claudeUnitStats(pid){
  var seen={},o=[];
  Object.keys(G.map).forEach(function(k){var s=G.map[k];Object.keys(s.space[pid]||{}).forEach(function(u){seen[u]=1;});s.planets.forEach(function(pl){Object.keys((pl.u||{})[pid]||{}).forEach(function(u){seen[u]=1;});});});
  Object.keys(seen).forEach(function(u){var st=ustat(pid,u);if(st)o.push(uname(u)+': '+statLine(st)+(abilText(st)?' — '+abilText(st):''));});

/* ---------- actions for activation, hand gate, pre-combat and the new combat rows ---------- */
function ext4(a,d,el,ev){
  var T=ui.tac,c=ui.combat,i,s,o,m,cx;
  switch(a){
    case 'tacOpen':return tacStart(+d.i)?1:2;
    case 'tacSel':if(!T)return 0;i=+d.i;if(T.sel[i]){delete T.sel[i];delete T.mv[i];}else T.sel[i]=true;return 2;
    case 'tacBonus':T.bonus=Math.max(0,Math.min(3,T.bonus+(+d.d)));return 2;
    case 'tacGo':
      tacClean(T);
      if(!Object.keys(T.sel).length){ui.tac=null;log(P(T.pid).name+' moved no units into slot '+T.i);var st0=tacAfter(T.pid,T.i);return 1;}
      T.step='moves';return 2;
    case 'tacBack':T.step='pick';return 2;
    case 'tacCancel':tacRefundToken(T.pid,T.i);G.tac=null;log(P(T.pid).name+' cancelled the activation of slot '+T.i);ui.tac=null;return 1;
    case 'tacMv':{
      o=+d.o;m=T.mv[o]||(T.mv[o]={u:{},p:{}});cx=tacCx();var av=tacAvail(T.pid,o),holder,max,key=d.u;
      if(d.w==='u'){holder=m.u;max=isShip(T.pid,key)?(av.ships[key]||0):(av.cargo[key]||0);}
      else{holder=(m.p[d.pl]=m.p[d.pl]||{});max=((av.planets[d.pl]||{})[key])||0;}
      var cur=holder[key]||0,nv=Math.max(0,Math.min(max,cur+(+d.d)));if(nv===cur)return 2;
      holder[key]=nv;
      var cap=tacCapCheck(cx,T.mv);
      if(!cap.ok){holder[key]=cur;ui.alert={t:'Not enough capacity',m:capMessage(cap)+((+d.d)<0?' Remove cargo before removing the ship that carries it.':'')};}
      return 2;}
    case 'tacMove':{
      tacClean(T);cx=tacCx();
      var err=tacCheckMoves(cx,T.mv);if(err){ui.alert={t:'That move is not allowed',m:err};return 2;}
      var lines=tacApplyMoves(T.pid,T.i,T.mv),pid=T.pid,t=T.i,rift=tacRiftShips(cx,T.mv);
      log(P(pid).name+' moved into slot '+t+(lines.length?': '+lines.join('; '):''));
      ui.tac=null;
      var combat=tacAfter(pid,t);
      if(rift&&!combat)ui.alert={t:'Gravity rift',m:'About '+rift+' ship'+(rift===1?'':'s')+' moved through or out of a gravity rift. Roll one die for each: on a 1, 2 or 3 the ship is destroyed.'};
      return 1;}
    case 'gateOpen':ui.gate={pid:d.p,shown:false};return 2;
    case 'gateShow':if(ui.gate)ui.gate.shown=true;return 2;
    case 'gateClose':ui.gate=null;return 2;
    case 'preNext':preNext();return 0;
    case 'cbOpen':
      i=+d.i;s=G.map[i];if(!s)return 0;
      var present=G.players.filter(function(q){return sum(s.space[q.id])||s.planets.some(function(x){return sum((x.u||{})[q.id]);});});
      if(present.length<2){toast('Combat needs forces from two players in this system. Add them first.');return 2;}
      closeSheet();
      var withShips=G.players.filter(function(q){return hasShips(s,q.id);}),gpl=null;
      if(withShips.length<2)s.planets.forEach(function(x,ix){if(gpl===null&&G.players.filter(function(q){var mm=(x.u||{})[q.id]||{};return mm.infantry||mm.mech;}).length>=2)gpl=ix;});
      var A=present.filter(function(q){return q.id===G.active;})[0]||present[0],D=present.filter(function(q){return q.id!==A.id;})[0];
      cbStart(i,A.id,D.id,{});ui.combat.pl=gpl;if(gpl!==null)ui.combat.noSpace=false;
      return 1;
    case 'cbHit':if(d.s==='a')c.xa=Math.max(0,c.xa+(+d.d));else c.xd=Math.max(0,c.xd+(+d.d));cbSync(c);return 2;
    case 'cbRow':{
      var rows=d.k==='pre'?cbPreRows(c,d.s):cbSideRows(c,d.s),r=rows[+d.r];if(!r)return 0;
      var key2=d.k==='pre'?'p'+d.s:d.s,id=d.k==='pre'?r.k:r.u;
      c.ov[key2][id]=c.ov[key2][id]||{};
      var lim=d.f==='dice'?[0,60]:[1,10];
      c.ov[key2][id][d.f]=Math.max(lim[0],Math.min(lim[1],r[d.f]+(+d.d)));
      delete c.res[key2][id];cbSync(c);return 2;}
    case 'cbRoll':{
      var rws=d.k==='pre'?cbPreRows(c,d.s):cbSideRows(c,d.s),k2=d.k==='pre'?'p'+d.s:d.s;
      var pick=d.r==='all'?rws:[rws[+d.r]];
      pick.forEach(function(r2){if(!r2)return;var vals=[];for(var q=0;q<r2.dice;q++)vals.push(rollD10());c.res[k2][d.k==='pre'?r2.k:r2.u]={vals:vals,on:r2.on,hits:vals.filter(function(v){return v>=r2.on;}).length};});
      cbSync(c);return 2;}
    case 'cbPre':{
      var pr2=cbPreRows(c,d.s),n=cbHitsOf(pr2),tgt=d.s==='a'?c.d:c.a;
      if(!n){toast('No hits to resolve. Roll first.');return 2;}
      var note=pr2.filter(function(r){return r.res&&r.res.hits;}).map(function(r){return r.name+': '+r.note;}).join(' ');
      log('Combat, slot '+c.i+': '+pn(d.s==='a'?c.a:c.d)+' scored '+n+' hit'+(n===1?'':'s')+' before combat against '+pn(tgt));
      c.res['p'+d.s]={};
      var cl2=claudeP();

      toast(pn(tgt)+' removes units for '+n+' hit'+(n===1?'':'s')+'. '+note);return 2;}
    case 'cbClaudeCards':cbAskCards();return 0;
    case 'cFix':{var e2=ui.cr&&ui.cr.applyErr;if(!e2)return 0;askClaude('turn','Your previous answer was rejected by the app and nothing was applied. Reason: '+e2+' Please give a corrected answer.');return 0;}
  }
  return undefined;
}


/* ====================== retreats, following the rules reference ====================== */
ui.poolPick=null;
function boardTokens(pid){var n=0;Object.keys(G.map).forEach(function(k){if((G.map[k].cmd||[]).indexOf(pid)>=0)n++;});return n;}
function reinforcementsOf(pid){var p=P(pid);return Math.max(0,16-(p.cmd.t+p.cmd.f+p.cmd.s)-boardTokens(pid));}
function retreatTargets(pid,slot){
  return nbrs(slot).filter(function(k){
    var s=G.map[k];if(!s||!s.tile)return false;
    if(G.players.some(function(q){return q.id!==pid&&hasShips(s,q.id);}))return false;
    return sum(s.space[pid])>0||s.planets.some(function(pl){return pl.owner===pid||sum((pl.u||{})[pid])>0;});
  });
}
function retreatPlaceToken(pid,slot){
  var s=ens(slot),p=P(pid);
  if(s.cmd.indexOf(pid)>=0)return 'That system already has one of their command tokens.';
  if(reinforcementsOf(pid)>0){s.cmd.push(pid);return 'A command token from reinforcements was placed there.';}
  var ks=['t','f','s'].filter(function(k){return p.cmd[k]>0;});
  if(!ks.length)return 'They have no command token to place.';
  if(p.claude){var best=ks.sort(function(a,b){return p.cmd[b]-p.cmd[a];})[0];p.cmd[best]--;s.cmd.push(pid);return 'No tokens in reinforcements, so one came from the '+({t:'tactic',f:'fleet',s:'strategy'}[best])+' pool.';}
  ui.poolPick={pid:pid,slot:slot};return 'Choose which pool the command token comes from.';
}
function renderPoolPick(){
  var pp=ui.poolPick,p=P(pp.pid);
  return '<div class="bd" style="align-items:center;z-index:60"><div class="sheet" role="alertdialog" aria-modal="true" aria-label="Command token" style="max-height:none;border-radius:18px;margin:16px;border-bottom:1px solid var(--line)"><div class="sheet-body"><h2 style="margin-bottom:8px">Take a command token</h2><p style="margin-top:0">'+esc(p.name)+' has no command tokens in reinforcements, so the token for slot '+pp.slot+' must come from their command sheet. Which pool?</p><div class="row">'+
    [['t','Tactic'],['f','Fleet'],['s','Strategy']].map(function(x){return '<button class="btn pri grow" data-act="poolTake" data-k="'+x[0]+'"'+(p.cmd[x[0]]>0?'':' disabled')+'>'+x[1]+' ('+p.cmd[x[0]]+')</button>';}).join('')+'</div></div></div></div>';
}
function cbRetreatActive(c){return c.pl===null&&!c.noSpace;}
function cbPending(c){return !!(c.retreating&&(c.retreating.a||c.retreating.d));}
function cbUndecided(c){return cbRetreatActive(c)&&!(c.rd.a&&c.rd.d);}
function cbDecide(side,to){
  var c=ui.combat;if(!c)return;
  c.rd[side]=true;
  if(to!=null){c.ret[side]={to:to};log('Combat, slot '+c.i+', round '+c.round+': '+pn(side==='a'?c.a:c.d)+' announces a retreat to slot '+to);}
  if(side==='d'&&to!=null)c.rd.a=true;
  save();render();
  cbNextDecision();
}
function cbNextDecision(){
  var c=ui.combat;if(!c||!cbRetreatActive(c)||cbPending(c)||c.busy)return;
  var cl=claudeP();
  if(!c.rd.d){if(cl&&cl.id===c.d)cbAskRetreat('d');return;}
  if(!c.rd.a){if(c.ret.d){c.rd.a=true;render();return;}if(cl&&cl.id===c.a)cbAskRetreat('a');}
}
async function cbAskRetreat(side){
  var c=ui.combat,cl=claudeP();if(!c||!cl||c.busy)return;
  side=side||(cl.id===c.d?'d':'a');
  if((side==='d'?c.d:c.a)!==cl.id||c.rd[side]||(side==='a'&&(!c.rd.d||c.ret.d)))return;
  if(!ui.sample||!hGet()){c.msg='Claude could not be asked, so it fights on.';cbDecide(side,null);return;}
  var targets=retreatTargets(cl.id,c.i),note='';
  c.busy='retreat';c.msg='';render();
  try{
    for(var attempt=0;attempt<2;attempt++){
      var r=await claudeCall('retreat',note,'quick'),d=r.data;
      if(!d)throw {code:'bad_json',text:r.raw};
      cbSetNotes(d);
      var rt=d.retreat||{};
      if(!rt.announce){c.msg='Claude will fight on. '+(d.say||'');c.busy=false;cbDecide(side,null);return;}
      var to=(rt.to_slot===null||rt.to_slot===undefined)?-1:+rt.to_slot;
      if(targets.indexOf(to)<0){
        note='You named slot '+rt.to_slot+', which is not a legal retreat destination. '+(targets.length?'The legal destinations are: '+targets.join(', ')+'.':'You have no legal destination, so you cannot retreat.');
        if(attempt===0)continue;
        c.msg='Claude could not name a legal retreat, so it fights on. '+(d.say||'');c.busy=false;cbDecide(side,null);return;
      }
      var s=ens(c.i),moved=[];
      Object.keys(rt.planet_units||{}).forEach(function(name){
        s.planets.forEach(function(pl){
          if(pl.name.toLowerCase()!==String(name).toLowerCase()||pl.owner!==cl.id)return;
          Object.keys(rt.planet_units[name]).forEach(function(u){
            var have=((pl.u||{})[cl.id]||{})[u]||0,n=Math.min(have,Math.floor(+rt.planet_units[name][u]||0));
            if(n>0&&(u==='infantry'||u==='mech')){pl.u[cl.id][u]=have-n;if(!pl.u[cl.id][u])delete pl.u[cl.id][u];s.space[cl.id]=s.space[cl.id]||{};s.space[cl.id][u]=(s.space[cl.id][u]||0)+n;moved.push(n+' '+uname(u)+' from '+pl.name);}
          });
        });
      });
      if(moved.length)log('Claude moved ground forces into space to retreat with them: '+moved.join(', '));
      c.msg='Claude announces a retreat to slot '+to+' after this round. '+(d.say||'');
      c.busy=false;cbDecide(side,to);return;
    }
  }catch(e){c.msg='Could not get Claude’s decision. Claude fights on. '+errText(e);c.busy=false;cbDecide(side,null);}
}
function cbMove(side){
  var c=ui.combat;if(!c||!c.retreating)return;
  side=side||(c.retreating.a?'a':'d');
  var r=c.retreating[side];if(!r)return;
  var pid=side==='a'?c.a:c.d,from=ens(c.i),to=ens(r.to);
  c.retreating[side]=null;
  if(!sum(from.space[pid])){toast(pn(pid)+' has no ships left to retreat.');save();render();cbNextDecision();return;}
  if(retreatTargets(pid,c.i).indexOf(r.to)<0){toast('That retreat is no longer legal. Move the ships by hand.');save();render();return;}
  var sp=from.space[pid]||{};to.space[pid]=to.space[pid]||{};
  Object.keys(sp).forEach(function(u){to.space[pid][u]=(to.space[pid][u]||0)+sp[u];});
  var dm=(from.dm||{})[pid]||{};
  if(Object.keys(dm).length){to.dm=to.dm||{};to.dm[pid]=to.dm[pid]||{};Object.keys(dm).forEach(function(u){to.dm[pid][u]=(to.dm[pid][u]||0)+dm[u];});}
  delete from.space[pid];if(from.dm)delete from.dm[pid];
  var tmsg=retreatPlaceToken(pid,r.to);
  log(pn(pid)+' retreated from slot '+c.i+' to slot '+r.to+'. '+tmsg);
  c.noSpace=!(hasShips(from,c.a)&&hasShips(from,c.d));
  c.msg=pn(pid)+' retreated to slot '+r.to+'. '+tmsg;
  save();render();
  if(!cbPending(c))cbNextDecision();
}
function retreatPanel(c,side){

async function cbAskHits(n,note){

function combatContext(kind,n,cc){

  if(c.pl===null&&s.type==='nebula')L.push('NEBULA: the defender applies +1 to each of its combat rolls in this combat.');
  [c.a,c.d].forEach(function(pid){var m=cbForces(c,pid);L.push(pn(pid)+' forces: '+(unitStr(m)||'none')+(dmText(s,pid)?' ('+dmText(s,pid)+')':''));});
  var st=[];[c.a,c.d].forEach(function(pid){var m=cbForces(c,pid);Object.keys(m).forEach(function(u){var x=ustat(pid,u);if(x)st.push(pn(pid)+' '+uname(u)+': '+statLine(x)+(abilText(x)?' — '+abilText(x):''));});});
  if(st.length)L.push('UNIT STATS IN THIS COMBAT:\n'+st.join('\n'));

  L.push('This system: '+JSON.stringify(so));

    L.push('LEGAL RETREAT DESTINATIONS (adjacent, containing your units or a planet you control, and no enemy ships): '+(tg.length?JSON.stringify(tg.map(sysObj)):'none, so you cannot retreat'));
  }

}
function ext5(a,d,el,ev){
  var c=ui.combat;
  switch(a){
    case 'cbRetGo':{var side=d.s,t=retreatTargets(side==='a'?c.a:c.d,c.i),to=+(c.sel[side]||t[0]);if(t.indexOf(to)<0){toast('Choose a legal destination first.');return 2;}cbDecide(side,to);return 0;}
    case 'cbRetNo':cbDecide(d.s,null);return 0;
    case 'cbAskRetreat':cbAskRetreat();return 0;
    case 'cbMove':cbMove(d.s);return 0;
    case 'cbRoll':if(d.k==='rows'&&c&&cbUndecided(c)){toast('Decide on retreats before rolling combat dice.');return 2;}return undefined;
    case 'cbRecord':if(c&&cbUndecided(c)){toast('Decide on retreats before recording the round.');return 2;}return undefined;
    case 'poolTake':{
      var pp=ui.poolPick;if(!pp)return 0;var p=P(pp.pid);
      if(p.cmd[d.k]>0){p.cmd[d.k]--;ens(pp.slot).cmd.push(pp.pid);log(p.name+' placed a command token in slot '+pp.slot+' from the '+({t:'tactic',f:'fleet',s:'strategy'}[d.k])+' pool');}
      ui.poolPick=null;return 1;}
  }
  return undefined;
}

var HIDDEN_ACTS={cApply:1,cDeal:1,cDraw:1,acPlay:1,acDiscard:1,soKeep:1,soScore:1,drawCard:1,objDraw:1,agdDraw:1,peekDone:1};

act=function(a,d,el,ev){

  var pre=JSON.stringify(G);

async function apiAsk(prompt,opts){
  var model=opts&&opts.modelTier==='quick'?API.m2:API.m1,res;

    res=await fetch(API.proxy?'api/claude':'https://api.anthropic.com/v1/messages',{method:'POST',signal:opts&&opts.signal,
      headers:API.proxy?{'content-type':'application/json','x-table-pass':API.pass}:{'content-type':'application/json','x-api-key':API.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:model,max_tokens:2500,messages:[{role:'user',content:prompt}]})});
  }catch(e){if(e&&e.name==='AbortError')throw {code:'cancelled'};throw {code:'network'};}

/* ---------- shared table state (only when served by the table server) ---------- */
var SY={rev:-1,timer:null};
function syOn(){return API.proxy&&!!API.pass;}
function syHdr(){return {'content-type':'application/json','x-table-pass':API.pass};}
function syPush(){
  if(!syOn())return;
  clearTimeout(SY.timer);
  SY.timer=setTimeout(function(){
    SY.timer=null;
    fetch('api/state',{method:'PUT',headers:syHdr(),body:JSON.stringify({game:G})}).then(function(r){return r.ok?r.json():null;}).then(function(j){if(j&&typeof j.rev==='number')SY.rev=j.rev;}).catch(function(){});
  },300);
}
function syBusy(){
  var a=document.activeElement;
  return !!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))||SY.timer||(ui.cr&&ui.cr.busy)||ui.stratBusy;
}
function syPoll(){
  if(!syOn())return;
  fetch('api/state?rev='+SY.rev,{headers:syHdr()}).then(function(r){return r.ok?r.json():null;}).then(function(j){
    if(!j||typeof j.rev!=='number')return;
    if(j.rev===SY.rev)return;
    if(!j.game){if(SY.rev<=0){SY.rev=0;syPush();}return;}
    if(syBusy())return;
    try{G=normalize(j.game);SY.rev=j.rev;try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}ui.undo=[];render();}catch(e){}
  }).catch(function(){});
}

    '<button class="btn pri" id="sy-go" style="width:100%">Join</button></div>';
  var go=document.getElementById('sy-go'),inp=document.getElementById('sy-pass');
  function join(){
    var v=inp.value.trim();if(!v)return;
    fetch('api/state?rev=-1',{headers:{'x-table-pass':v}}).then(function(r){
      if(r.status===401||r.status===429){var m=document.getElementById('sy-msg');if(m)m.textContent=r.status===429?'Too many tries. Wait a few minutes.':'Wrong passcode.';return null;}
      return r.ok?r.json():null;
    }).then(function(j){
      if(!j)return;
      API.pass=v;apiSave();refreshAsker();SY.rev=-1;
      if(j.game){try{G=normalize(j.game);SY.rev=j.rev;localStorage.setItem(KEY,JSON.stringify(G));ui.undo=[];}catch(e){}}
      render();
    }).catch(function(){var m=document.getElementById('sy-msg');if(m)m.textContent='Could not reach the table server.';});
  }
  go.onclick=join;inp.onkeydown=function(e){if(e.key==='Enter')join();};inp.focus();
}
function apiReady(){return API.proxy?!!API.pass:!!API.key;}
function refreshAsker(){ui.sample=ui.builtin||(apiReady()?apiAsk:null);}
function apiStatus(){
  if(ui.builtin)return 'Claude can already be asked from inside the Claude app. A key is only used when you open this page somewhere else.';
  if(API.proxy)return API.pass?'Table passcode saved on this device. Claude is asked through the table server; the API key never leaves it.':'Enter the table passcode to turn on the Ask Claude buttons.';
  return API.key?'API key saved on this device (ends in '+API.key.slice(-4)+'). Claude can be asked from this page.':'No key yet. Without one, the Ask Claude buttons stay off.';
}
function renderApi(){
  return '<div class="sec"><h2>Ask Claude outside the Claude app</h2><div class="card"><p class="mut small" style="margin-top:0">'+esc(apiStatus())+'</p>'+
    (API.proxy?'<label class="fld"><span>Table passcode</span><input id="api-pass" type="password" autocomplete="off" placeholder="'+(API.pass?'Saved. Type a new passcode to replace it':'Passcode')+'"></label>':'<label class="fld"><span>Anthropic API key</span><input id="api-key" type="password" autocomplete="off" placeholder="'+(API.key?'Saved. Type a new key to replace it':'sk-ant-…')+'"></label>')+
    '<div class="row" style="margin-top:8px"><label class="fld grow"><span>Model for turns and decisions (Claude id, or an OpenRouter id like vendor/name:free)</span><input id="api-m1" type="text" autocomplete="off" value="'+esc(API.m1)+'"></label><label class="fld grow"><span>Model for quick combat calls</span><input id="api-m2" type="text" autocomplete="off" value="'+esc(API.m2)+'"></label></div>'+
    '<div class="row" style="margin-top:10px"><button class="btn pri" data-act="apiSave">Save</button><button class="btn" data-act="apiTest"'+(apiReady()?'':' disabled')+'>Test</button><button class="btn danger" data-act="apiClear"'+(apiReady()?'':' disabled')+'>'+(API.proxy?'Remove passcode':'Remove key')+'</button></div>'+
    '<p class="mut small" style="margin-bottom:0">The key or passcode stays on this device and is never part of a saved game. Calls are billed to your API account. This only works when the page is opened outside Claude, because pages inside Claude cannot reach the API directly.</p></div></div>';
}
function apiAct(a){
  if(a==='apiSave'){
    var k=($('#api-key')||{}).value||'',m1=(($('#api-m1')||{}).value||'').trim(),m2=(($('#api-m2')||{}).value||'').trim();
    var pw=(($('#api-pass')||{}).value||'');if(k.trim())API.key=k.trim();if(pw.trim())API.pass=pw.trim();if(m1)API.m1=m1;if(m2)API.m2=m2;
    apiSave();refreshAsker();toast('Saved.');return;
  }
  if(a==='apiClear'){API.key='';API.pass='';apiSave();refreshAsker();toast('Key removed.');return;}
  if(a==='apiTest'){
    toast('Testing…');render();
    apiAsk('Reply with the single word OK.',{modelTier:'quick'}).then(function(r){toast(/ok/i.test(r.text)?'Connected.':'Connected, but the reply was unexpected.');render();},function(e){toast(errText(e));render();});
  }
}
