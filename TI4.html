<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>TI4 Table Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef1f6; --panel:#ffffff; --panel2:#e3e9f2; --line:#c3cddb; --ink:#14202f; --mut:#566579;
  --acc:#7d5f16; --acc-ink:#ffffff; --warn:#b4570a; --ok:#2f7d4a;
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1220; --panel:#141f33; --panel2:#1b2a45; --line:#2b3d5b; --ink:#e8eef7; --mut:#93a4bd;
    --acc:#d6b062; --acc-ink:#1a1305; --warn:#f2a65c; --ok:#6cc48a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1220; --panel:#141f33; --panel2:#1b2a45; --line:#2b3d5b; --ink:#e8eef7; --mut:#93a4bd;
  --acc:#d6b062; --acc-ink:#1a1305; --warn:#f2a65c; --ok:#6cc48a; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans);min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0}
.mut{color:var(--mut)}
.small{font-size:12.5px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px 8px}
.r1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttl{display:flex;align-items:baseline;gap:8px}
.ttl-main{font:700 20px var(--serif)}
.ttl-sub{color:var(--mut)}
.r2{display:flex;align-items:center;gap:6px;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px 0 8px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel2);white-space:nowrap}
.chip .dot{width:12px;height:12px}
.chip.on{border-color:var(--c);background:var(--panel);box-shadow:inset 0 0 0 1px var(--c);font-weight:700}
.chip.ps{opacity:.45;text-decoration:line-through}
.chip .ini{font-size:11px;color:var(--mut)}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;border:1.5px solid color-mix(in srgb,var(--ink) 35%,transparent)}
.btn{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:700}
.btn.sm{min-height:34px;padding:0 10px;font-size:13.5px}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4}

/* layout */
main{padding:12px 12px calc(84px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;min-height:56px;border:0;background:none;font-weight:500;color:var(--mut);border-top:3px solid transparent}
.nav button.on{color:var(--ink);font-weight:700;border-top-color:var(--acc)}
.sec{margin:0 0 18px}
.sec>h2{font-size:18px;margin-bottom:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.pcard{border-left:6px solid var(--c)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.note{padding:12px 14px;border:1px dashed var(--line);border-radius:12px;color:var(--mut)}

/* map */
.mapwrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--panel);-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
.mapwrap svg{display:block;height:auto}
.zoom{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px;align-items:center}
.hexg{cursor:pointer}
.hx{fill:var(--panel2);stroke:var(--line);stroke-width:1.5}
.hx.empty{fill:none;stroke-dasharray:4 4}
.hexg:hover .hx,.hexg:focus-visible .hx{stroke:var(--acc);stroke-width:2.5}
.tint{fill:currentColor;fill-opacity:.24;stroke:none;pointer-events:none}
.tt-asteroid{color:#9aa0aa}.tt-nebula{color:#a374e6}.tt-supernova{color:#ee5a41}.tt-rift{color:#38b9cf}.tt-mecatol{color:#e0b653}
.hx-num{fill:var(--ink);font:700 17px var(--sans);text-anchor:middle}
.hx-pos{fill:var(--mut);font:500 9px var(--sans)}
.hx-tag{fill:var(--mut);font:600 8.5px var(--sans);text-anchor:end}
.hx-wh{fill:var(--acc);font:700 13px var(--serif);text-anchor:middle}
.hx-chip{stroke:color-mix(in srgb,var(--ink) 40%,transparent);stroke-width:1}
.hx-cn{font:700 9.5px var(--sans);text-anchor:middle}
.hx-pl{stroke:var(--mut);stroke-width:1.3;fill:none}
.hx-pln{fill:var(--ink);font:700 8px var(--sans);text-anchor:middle}

/* sheet */
.bd{position:fixed;inset:0;z-index:40;background:rgba(5,10,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:760px;max-height:90%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;border:1px solid var(--line);border-bottom:0}
.sh-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel);border-radius:18px 18px 0 0}
.sh-hd h2{font-size:18px}
.sheet-body{overflow-y:auto;padding:12px 12px calc(20px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:12.5px;color:var(--mut)}
input[type=text],input[type=number],select,textarea{min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);width:100%}
textarea{min-height:110px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
.tog{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 10px;margin-top:6px}
.tog .sum{margin-left:auto;color:var(--mut);font-size:12.5px;text-align:right}
.tog .chev{color:var(--mut)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.st{display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px 4px 3px 10px}
.stl{flex:1;font-size:13.5px}
.sb{width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-size:20px;line-height:1;padding:0}
.st b,.ctr b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.ctr{display:flex;align-items:center;gap:6px}
.ctr>span{flex:1;font-size:14px}
.warn{color:var(--warn);font-size:12.5px;margin-top:6px}
.tk{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px 0 9px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel)}
.tk[aria-pressed=true]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);font-weight:700}
.pl{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--panel)}
.pl-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rinf{font-variant-numeric:tabular-nums;font-weight:700}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;margin:10px 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px 0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:13.5px}
.tag.ex{opacity:.5;text-decoration:line-through}
.tag .x{border:0;background:none;color:var(--mut);padding:2px 6px;min-height:28px}
.tcol{width:9px;height:9px;border-radius:2px;background:var(--tc)}
.log li{padding:7px 0;border-bottom:1px solid var(--line);list-style:none}
.log ul{margin:0;padding:0}
.log .meta{font-size:12px;color:var(--mut)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;max-width:90%;font-size:14px}
details summary{cursor:pointer;min-height:36px;display:flex;align-items:center}
.pk-item{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
input[type=search]{min-height:40px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);width:100%;margin-bottom:6px}
.nav button{font-size:13px;padding:0 2px}
.spk{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.05em;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:0 5px;margin-left:4px;line-height:16px}
.pk-item[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}

"pn":["Military Support","At the start of the Sol player's turn: Remove 1 token from the Sol player's strategy pool, if able, and return it to their reinforcements. Then, you may place 2 infantry from your reinforcements on any planet you control. Then, return this card to the Sol player."]},"creuss":{"ab":[["Quantum Entanglement","You treat all systems that contain either an alpha or beta wormhole as adjacent to each other. Game effects cannot prevent you from using this ability."],["Slipstream","During your tactical actions, apply +1 to the move value of each of your ships that starts its movement in your home system or in a system that contains either an alpha or beta wormhole."],["Creuss Gate","When you create the game board, place the Creuss Gate (tile 17) where your home system would normally be placed. The Creuss Gate system is not a home system. Then, place your home system (tile 51) in your play area."]],"c":4,"mech":["Icarus Drive","After any player activates a system, you may remove this unit from the game board to place or move a Creuss wormhole token into this system. SUSTAIN DAMAGE."],"pn":["Creuss Iff","At the start of your turn during the action phase: Place or move a Creuss wormhole token into either a system that contains a planet you control or a non-home system that does not contain another player's ships. Then, return this card to the Creuss player."]},"l1z1x":{"ab":[["Assimilate","When you gain control of a planet, replace each PDS and space dock that is on that planet with a matching unit from your reinforcements."],["Harrow","At the end of each round of ground combat, your ships in the active system may use their Bombardment abilities against your opponent's ground forces on the planet."]],"c":2,"mech":["Annihilator","While not participating in ground combat, this unit can use its BOMBARDMENT ability on planets in its system as if it were a ship. SUSTAIN DAMAGE. BOMBARDMENT 8."],"pn":["Cybernetic Enhancements","At the start of your turn: Remove 1 token from the L1Z1X player's strategy pool and return it to his reinforcements. Then, place 1 command token from your reinforcements in your strategy pool. Then, return this card to the L1Z1X player."]},"mentak":{"ab":[["Ambush","At the start of a space combat, you may roll 1 die for each of up to 2 of your cruisers or destroyers in the system. For each result equal to or greater than that ship's combat value, produce 1 hit; your opponent must assign it to 1 of their ships."],["Pillage","After 1 of your neighbors gains trade goods or resolves a transaction, if they have 3 or more trade goods, you may take 1 of their trade goods or commodities."]],"c":2,"mech":["Moll Terminus","Other players' ground forces on this planet cannot use SUSTAIN DAMAGE. SUSTAIN DAMAGE."],"pn":["Promise of Protection","ACTION: Place this card face-up in your play area. While this card is in your play area, the Mentak player cannot use their Pillage faction ability against you. If you activate a system that contains 1 or more of the Mentak player's units, return this card to the Mentak player."]},"naalu":{"ab":[["Telepathic","At the end of the strategy phase, place the Naalu \"0\" token on your strategy card; you are first in initiative order."],["Foresight","After another player moves ships into a system that contains 1 or more of your ships, you may place 1 token from your strategy pool in an adjacent system that does not contain another player's ships; move your ships from the active system into that system."]],"c":3,"mech":["Iconoclast","During combat against an opponent who has at least 1 relic fragment, apply +2 to the results of this unit's combat rolls. SUSTAIN DAMAGE."],"pn":["Gift of Prescience","At the end of the strategy phase: Place this card face-up in your play area and place the Naalu \"0\" token on your strategy card; you are first in the initiative order. The Naalu player cannot use their TELEPATHIC faction ability during this game round. Return this card to the Naalu player at the end of the status phase."]},"nekro":{"ab":[["Galactic Threat","You cannot vote on agendas. Once per agenda phase, after an agenda is revealed, you may predict aloud the outcome of that agenda. If your prediction is correct, gain 1 technology that is owned by a player who voted how you predicted."],["Technological Singularity","Once per combat, after 1 of your opponent's units is destroyed, you may gain 1 technology that is owned by that player."],["Propagation","You cannot research technology. When you would research a technology, gain 3 command tokens instead."]],"c":3,"mech":["Mordred","During combat against an opponent who has an \"X\" or \"Y\" token on 1 or more of their technologies, apply +2 to the result of each of this unit's combat rolls. SUSTAIN DAMAGE."],"pn":["Antivirus","At the start of a combat: Place this card face-up in your play area. While this card is in your play area, the Nekro player cannot use their TECHNOLOGICAL SINGULARITY faction ability against you. If you activate a system that contains 1 or more of the Nekro player's units, return this card to the Nekro player."]},"sardakk":{"ab":[["Unrelenting","Apply +1 to the result of each of your unit's combat rolls."]],"c":3,"mech":["Valkyrie Exoskeleton","After this unit uses its SUSTAIN DAMAGE ability during Ground Combat, it produces 1 hit against your opponent's ground forces on this planet. SUSTAIN DAMAGE."],"pn":["Tekklar Legion","At the start of an invasion combat: Apply +1 to the result of each of your unit's combat rolls during this combat. If your opponent is the N'orr player, apply -1 to the result of each of his unit's combat rolls during this combat. Then, return this card to the N'orr player."]},"jolnar":{"ab":[["Fragile","Apply -1 to the result of each of your unit's combat rolls."],["Brilliant","When you spend a command token to resolve the secondary ability of the \"Technology\" strategy card, you may resolve the primary ability instead."],["Analytical","When you research a technology that is not a unit upgrade technology, you may ignore 1 prerequisite."]],"c":4,"mech":["Shield Paling","Your infantry on this planet are not affected by your FRAGILE faction ability. SUSTAIN DAMAGE."],"pn":["Research Agreement","After the Jol-Nar player researches a technology that is not a faction technology: Gain that technology. Then, return this card to the Jol-Nar player."]},"winnu":{"ab":[["Blood Ties","You do not have to spend influence to remove the custodians token from Mecatol Rex."],["Reclamation","After you resolve a tactical action during which you gained control of Mecatol Rex, you may place 1 PDS and 1 space dock from your reinforcements on Mecatol Rex."]],"c":3,"mech":["Reclaimer","After you resolve a tactical action where you gained control of this planet, you may place 1 PDS or 1 Space Dock from your reinforcements on this planet. SUSTAIN DAMAGE."],"pn":["Acquiescence","At the end of the strategy phase: Exchange 1 of your strategy cards with a strategy card that was chosen by the Winnu player. Then, return this card to the Winnu player."]},"xxcha":{"ab":[["Peace Accords","After you resolve the primary or secondary ability of the \"Diplomacy\" strategy card, you may gain control of 1 planet other than Mecatol Rex that does not contain any units and is in a system that is adjacent to a planet you control."],["Quash","When an agenda is revealed, you may spend 1 token from your strategy pool to discard that agenda and reveal 1 agenda from the top of the deck. Players vote on this agenda instead."]],"c":4,"mech":["Indomitus","You may use this unit's Space Cannon ability against ships that are in adjacent systems. SUSTAIN DAMAGE. SPACE CANNON 8."],"pn":["Political Favor","When an agenda is revealed: Remove 1 token from the Xxcha player's strategy pool and return it to their reinforcements. Then, discard the revealed agenda and reveal 1 agenda from the top of the deck. Players vote on this agenda instead. Then, return this card to the Xxcha player."]},"yin":{"ab":[["Indoctrination","At the start of a ground combat, you may spend 2 influence to replace 1 of your opponent's participating infantry with 1 infantry from your reinforcements."],["Devotion","After each space battle round, you may destroy 1 of your cruisers or destroyers in the active system to produce 1 hit and assign it to 1 of your opponent's ships in that system."]],"c":2,"mech":["Moyin's Ashes","DEPLOY: When you use your INDOCTRINATION faction ability, you may spend 1 additional influence to replace your opponent's unit with 1 mech instead of 1 infantry. SUSTAIN DAMAGE."],"pn":["Greyfire Mutagen","After a system is activated: The Yin player cannot use faction abilities or faction technology during this tactical action. Then, return this card to the Yin player."]},"yssaril":{"ab":[["Stall Tactics","ACTION: Discard 1 action card from your hand."],["Scheming","When you draw 1 or more action cards, draw 1 additional action card. Then, choose and discard 1 action card from your hand."],["Crafty","You can have any number of action cards in your hand. Game effects cannot prevent you from using this ability."]],"c":3,"mech":["Blackshade Infiltrator","DEPLOY: After you use your STALL TACTICS faction ability, you may place 1 mech on a planet you control. SUSTAIN DAMAGE."],"pn":["Spy Net","At the start of your turn: Look at the Yssaril player's hand of action cards. Choose 1 of those cards and add it to your hand. Then, return this card to the Yssaril player."]},"argent":{"ab":[["Zeal","You always vote first during the agenda phase. When you cast at least 1 vote, cast 1 additional vote for each player in the game including you."],["Raid Formation","When 1 or more of your units uses ANTI-FIGHTER BARRAGE, for each hit produced in excess of your opponent's fighters, choose 1 of your opponent's ships that has SUSTAIN DAMAGE to become damaged."]],"c":3,"mech":["Aerie Sentinel","This unit does not count against capacity if it is being transported or if it is in a space area with 1 or more of your ships that have capacity values. SUSTAIN DAMAGE."],"pn":["Strike Wing Ambuscade","When 1 or more of your units make a roll for a unit ability: Choose 1 of those units to roll 1 additional die. Then, return this card to the Argent player."]},"empyrean":{"ab":[["Voidborn","Nebulae do not affect your ships' movement."],["Aetherpassage","After a player activates a system, you may allow that player to move their ships through systems that contain your ships."],["Dark Whispers","During setup, take the additional Empyrean faction promissory note; you have 2 faction promissory notes."]],"c":4,"mech":["Watcher","You may remove this unit from a system that contains or is adjacent to another player's units to cancel an action card played by that player. SUSTAIN DAMAGE."],"pn":["Dark Pact","ACTION: Place this card face up in your play area. When you give a number of commodities to the Empyrean player equal to your maximum commodity value, you each gain 1 trade good. If you activate a system that contains 1 or more of the Empyrean player's units, return this card to the Empyrean player."]},"mahact":{"ab":[["Edict","When you win a combat, place 1 command token from your opponent's reinforcements in your fleet pool if it does not already contain 1 of that player's tokens; other player's tokens in your fleet pool increase your fleet limit but cannot be redistributed."],["Imperia","While another player's command token is in your fleet pool, you can use the ability of that player's commander, if it is unlocked."],["Hubris","During setup, purge your \"Alliance\" promissory note. Other players cannot give you their \"Alliance\" promissory note."]],"c":3,"mech":["Starlancer","After a player whose command token is in your fleet pool activates this system, you may spend their token from your fleet pool to end their turn; they gain that token. SUSTAIN DAMAGE."],"pn":["Scepter of Dominion","At the start of the strategy phase: Choose 1 non-home system that contains your units; each other player who has a token on the Mahact player's command sheet places a token from their reinforcements in that system. Then, return this card to the Mahact player."]},"naazrokha":{"ab":[["Distant Suns","When you explore a planet that contains 1 of your mechs, you may draw 1 additional card; choose 1 to resolve and discard the rest."],["Fabrication","ACTION: Either purge 2 of your relic fragments of the same type to gain 1 relic; or purge 1 of your relic fragments to gain 1 command token."]],"c":3,"mech":["Eidolon","If this unit is in the space area of the active system at the start of a space combat, flip this card. SUSTAIN DAMAGE. This card begins the game with this side face up."],"pn":["Black Market Forgery","ACTION: Purge 2 of your relic fragments of the same type to gain 1 relic. Then, return this card to the Naaz-Rokha player."]},"nomad":{"ab":[["The Company","During setup, take the 2 additional Nomad faction agents and place them next to your faction sheet; you have 3 agents."],["Future Sight","During the Agenda phase, after an outcome that you voted for or predicted is resolved, gain 1 trade good."]],"c":4,"mech":["Quantum Manipulator","While this unit is in a space area during combat, you may use its SUSTAIN DAMAGE ability to cancel a hit that is produced against your ships in this system. SUSTAIN DAMAGE."],"pn":["The Cavalry","At the start of a space combat against a player other than the Nomad: During this combat, treat 1 of your non-fighter ships as if it has the SUSTAIN DAMAGE ability, combat value, and ANTI-FIGHTER BARRAGE value of the Nomad's flagship. Return this card to the Nomad player at the end of this combat."]},"titans":{"ab":[["Terragenesis","After you explore a planet that does not have a sleeper token, you may place or move 1 sleeper token onto that planet."],["Awaken","After you activate a system that contains 1 or more of your sleeper tokens, you may replace each of those tokens with 1 PDS from your reinforcements."],["Coalescence","If your flagship or your AWAKEN faction ability places your units into the same space area or onto the same planet as another player's units, your units must participate in combat during \"Space Combat\" or \"Ground Combat\" steps."]],"c":2,"mech":["Hecatoncheires","DEPLOY: When you would place a PDS on a planet, you may place 1 mech and 1 infantry on that planet instead. SUSTAIN DAMAGE."],"pn":["Terraform","ACTION: Attach this card to a non-home planet you control other than Mecatol Rex. Its resource and influence values are each increased by 1 and it is treated as having all 3 planet traits (Cultural, Hazardous, and Industrial)."]},"cabal":{"ab":[["Devour","Capture your opponent's non-structure units that are destroyed during combat."],["Amalgamation","When you produce a unit, you may return 1 captured unit of that type to produce that unit without spending resources."],["Riftmeld","When you research a unit upgrade technology, you may return 1 captured unit of that type to ignore all of the technology's prerequisites."]],"c":2,"mech":["Reanimator","When your infantry on this planet are destroyed, place them on your faction sheet; those units are captured. SUSTAIN DAMAGE."],"pn":["Crucible","After you activate a system: Your ships do not roll for gravity rifts during this movement; apply an additional +1 to the move values of your ships that would move out of or through a gravity rift instead. Then, return this card to the Vuil'raith player."]}};
var RULES={"object-of-the-game":["Object of the Game","Throughout a game of Twilight Imperium, players will barter, plot, and wage war upon one another to complete objectives. The first player to accumulate 10 victory points claims the Imperial Throne and wins the game.",[]],"game-round":["Game Round","Twilight Imperium is played over a series of game rounds, each of which contains four phases resolved in order: 1) Strategy Phase, 2) Action Phase, 3) Status Phase, 4) Agenda Phase. The agenda phase is only added after a player gains control of Mecatol Rex. These phases repeat in successive game rounds until one player accumulates 10 victory points.",[["Strategy Phase","During the strategy phase, players take turns selecting a strategy card. Beginning with the speaker and continuing clockwise, each player chooses one of the strategy cards from the common play area and places it faceup near his faction sheet. Each strategy card has an initiative number (1-8) that determines turn order during the action phase. After each player has chosen a strategy card, the speaker places one trade good on each unchosen strategy card."],["Action Phase","During the action phase, players take turns in initiative order. The active player performs one action per turn. After each player has taken a turn, player turns begin again in initiative order. The action phase does not end until each player has passed. There are three types of actions: tactical actions, strategic actions, and component actions. A player cannot pass until he has performed his strategic action."],["Status Phase","During the status phase, players perform the following steps in order: 1) Score Objectives - each player may score up to one public and one secret objective. 2) Reveal Public Objective - speaker flips next unrevealed objective. 3) Draw Action Cards - each player draws one. 4) Remove Command Tokens - from the game board to reinforcements. 5) Gain and Redistribute Command Tokens - each player gains two, then may redistribute between pools. 6) Ready Cards - all exhausted cards are readied. 7) Repair Units - damaged units are repaired. 8) Return Strategy Cards - to common play area."],["Agenda Phase","After the custodians token has been removed from Mecatol Rex, the agenda phase is added to each round for the remainder of the game. Players vote on two agendas. For each agenda: 1) Reveal Agenda - speaker draws and reads an agenda card. 2) Vote - starting left of the speaker clockwise, each player exhausts planets for votes equal to their influence value, committing votes to a single outcome. 3) Resolve Outcome - the outcome with the most votes is resolved. Ties are decided by the speaker. After two agendas, all planets are readied."]]],"command-tokens":["Command Tokens","Command tokens are placed in three pools on the command sheet: Tactic Pool (spent to perform tactical actions), Fleet Pool (ship silhouette faceup - the number of tokens equals the maximum number of non-fighter ships a player can have in each system), Strategy Pool (spent to use secondary abilities of strategy cards). During the status phase, each player gains 2 command tokens and may redistribute all tokens between pools.",[]],"units":["Units","There are three categories of units: Ships (spacefaring units for combat and expansion - Flagship, War Sun, Dreadnought, Cruiser, Carrier, Destroyer, Fighter), Ground Forces (infantry and mechs for invading and defending planets), and Structures (Space Dock and PDS, military installations). A player's unused units and command tokens form his reinforcements.",[]],"unit-abilities":["Unit Abilities","Units may have keyword abilities printed on faction sheets and unit upgrade technology cards.",[["Sustain Damage","A unit with Sustain Damage can become damaged to cancel one hit. A damaged unit is turned on its side but otherwise functions normally. A damaged unit cannot use Sustain Damage again until repaired (during the status phase or by another game effect)."],["Planetary Shield","If a unit has Planetary Shield, the planet where that unit is located is not an eligible target for other units' Bombardment abilities."],["Production","A unit with the Production ability can produce new units. The ability is followed by a value which dictates the maximum number of units that unit can produce. Space Dock I has PRODUCTION X where X = 2 + resource value of the planet."],["Anti-Fighter Barrage","Used during the Anti-Fighter Barrage step of the first round of space combat. Roll dice equal to the number in parentheses; each result equal to or greater than the ability value produces a hit. Hits from Anti-Fighter Barrage can only be assigned to fighters."],["Bombardment","Used during the Bombardment step of an invasion. Roll dice; each result equal to or greater than the ability value produces a hit. Hits can only be assigned to ground forces on the planet being bombarded. If multiple planets exist, the active player chooses which units bombard which planets before rolling. Bombardment is blocked by Planetary Shield."],["Space Cannon","Used at two times: 1) Space Cannon Offense - after Movement step, all players' units in the active system may fire at the active player's ships. 2) Space Cannon Defense - during invasion, the defending player's units on the planet may fire at invading ground forces. Roll dice; each result >= ability value produces a hit."]]],"capacity":["Capacity","The number of fighters and ground forces in the space area of a system cannot exceed the combined capacity of that player's ships in that system. Ground forces on planets do not count against capacity. If a player's fighters and ground forces in space exceed capacity, excess units are destroyed. During combat, capacity can be temporarily exceeded, but excess units are destroyed at the end of combat.",[]],"fleet-pool":["Fleet Pool","The number of tokens in a player's fleet pool (ship silhouette faceup) is the maximum number of non-fighter ships he can have in each system. If a player has more ships than fleet pool tokens in a system, he must return excess ships to reinforcements.",[]],"reinforcements":["Reinforcements","A player's personal supply of unused units and unused command tokens is his reinforcements. When producing units or gaining command tokens, they come from reinforcements. If a player has no units of a type in reinforcements, he may remove one from a system without his command token and return it to reinforcements. Fighter and infantry tokens from the supply can substitute for plastic figures but must be accompanied by at least one matching plastic figure.",[]],"planets":["Planets","Each planet card displays two values: resources (yellow, left) and influence (blue, right). Resources are spent to produce units and technologies. Influence is spent to gain command tokens and vote during the agenda phase. When a player gains control of a planet, he takes its card exhausted. Most planets outside home systems have a trait: cultural, hazardous, or industrial. Some planets have a technology specialty that can be exhausted to ignore a matching tech prerequisite.",[]],"exhausted-and-readied":["Exhausted and Readied Cards","Many cards have a readied and exhausted state. An exhausted card is flipped facedown, indicating its values and abilities cannot be used. During the status phase, all exhausted cards are readied (flipped faceup).",[]],"spending-resources-and-influence":["Spending Resources and Influence","To spend a planet's resources or influence, a player exhausts that planet's card. Excess resources or influence from a planet are lost. Players may spend trade goods as either one resource or one influence.",[]],"technology":["Technology","Technologies provide powerful abilities and unit upgrades. There are four basic colors: green (biotic), blue (propulsion), yellow (cybernetic), red (warfare). To research a technology, a player must own matching technologies for each prerequisite symbol. Unit upgrade technologies may have multi-color prerequisites and do not satisfy prerequisites. When a unit upgrade is gained, it replaces the corresponding unit stats for all units of that type. Some planets have technology specialties that can be exhausted to ignore a matching prerequisite.",[]],"objectives":["Objectives","Players gain victory points by completing objectives. Public objectives can be scored by any player; a player cannot score public objectives if he does not control all planets in his home system. Secret objectives are hidden and only scored by their owner. A player can have a maximum of 3 total secret objectives (scored + unscored). Each player can score one public and one secret objective during each status phase and each step of the action phase. Some objectives have 'Action Phase' timing and can be scored immediately after fulfilling requirements.",[]],"trade-goods-and-commodities":["Trade Goods and Commodities","Trade goods are universal currency that can be spent as one resource or one influence. Commodities have no inherent value but become trade goods when given to another player (the token is flipped). When a player replenishes commodities (usually via the Trade strategy card), he takes tokens up to his faction's commodity value. A player cannot have more commodities than his printed value.",[]],"neighbors-and-transactions":["Neighbors, Transactions, and Deals","Two players are neighbors if either has a unit or controls a planet in a system adjacent to a system where the other has a unit or planet. During the active player's turn, he may negotiate one transaction with each neighbor per turn, exchanging trade goods and commodities. Binding deals involve effects resolvable immediately and must be honored. Non-binding deals involve future promises and need not be honored.",[]],"action-cards":["Action Cards","Players accumulate action cards throughout the game. Each card indicates when it can be used. A player can have a maximum of 7 action cards in hand; excess must be discarded. When used, reveal the card, resolve its effect, and discard. Cards beginning with 'Action' can be used as component actions during a player's turn.",[]],"promissory-notes":["Promissory Notes","Each player begins with 5 promissory note cards (4 color-specific, 1 faction-specific). Promissory notes help negotiate by creating enforceable contracts. A player can offer a promissory note as part of a transaction. A player cannot resolve his own promissory notes. When resolved, the card is usually returned to its original owner. Only one promissory note can be traded per transaction. Players may also trade promissory notes received from other players without the original owner's permission.",[]],"tactical-action":["Tactical Action","A tactical action allows a player to move ships, initiate combat, invade planets, produce units, and otherwise interact with the game board. A player performs a tactical action by spending a command token from his tactic pool.",[["1. Activation","The active player activates a system by taking a command token from his tactic pool and placing it on that system. That system is the active system for the remainder of the tactical action. A player cannot activate a system that already contains one of his command tokens. A player cannot activate a system if he does not have any command tokens in his tactic pool."],["2. Movement","The active player may move ships into the active system from any number of other systems. Each ship has a move value indicating how far it can travel. A ship must end its movement in the active system. A ship cannot pass through a system that contains another player's ships (excluding fighters). A player cannot move units out of a system that contains one of his command tokens. Ships with capacity can transport fighters and ground forces up to their capacity value."],["3. Space Combat","If multiple players have ships in the active system, they resolve space combat. The active player is the attacker, the other player is the defender. Combat rounds: i) Anti-Fighter Barrage, ii) Announce Retreats, iii) Make Combat Rolls - roll one die per ship, hits produced on results >= combat value, iv) Assign Hits - each player destroys one of his ships per hit opponent produced, v) Retreat - if announced, move all ships to an adjacent valid system. Combat continues until one side is eliminated or retreats."],["4. Invasion","The active player can invade planets in the active system. Steps: i) Bombardment - active player may use Bombardment abilities against planets with enemy ground forces. ii) Commit Ground Forces - move ground forces from space area to planets. iii) Space Cannon Defense - defending PDS may fire at invading ground forces. iv) Ground Combat - resolved in rounds like space combat (Make Combat Rolls, Assign Hits) until one side eliminated. v) Establish Control - active player gains control of invaded planets with his ground forces, takes planet card exhausted, enemy structures destroyed."],["5. Production","The active player can produce units using space docks in the active system. To produce units, spend resources equal to the combined cost of chosen units. Ships are placed in space area, ground forces on the planet with the space dock. Each space dock has a production value limiting the number of units it can produce. Units with a cost showing two icons (fighters, infantry) give two units for the indicated cost, but each counts against production limit. Blockaded space docks (enemy ships in system) cannot produce ships but can produce ground forces."]]],"strategic-action":["Strategic Action","When a player performs a strategic action, he resolves the primary ability of his strategy card. After resolving, each other player may resolve the secondary ability of that strategy card. The active player cannot resolve the secondary ability of his own strategy card. After all players have had the opportunity, the card is exhausted (flipped facedown). A player cannot pass during the action phase unless his strategy card is exhausted.",[]],"component-action":["Component Action","A component action is an action printed on a game component (action cards, faction sheets, technology cards). Each of these effects is preceded by the word 'Action.' A player performs a component action during his turn of the action phase.",[]],"wormholes":["Wormholes","Some system tiles contain wormholes. There are two types of basic wormholes: alpha and beta. Systems that contain identical wormholes are adjacent to one another for all purposes.",[]],"anomalies":["Anomalies","Some system tiles contain anomalies that restrict movement and have special rules.",[["Asteroid Field","A ship cannot move through or into an asteroid field."],["Nebula","A ship cannot move through a nebula but may move into one. A defender's ship in a nebula applies +1 to each combat roll result. A ship moving out of a nebula has a move value of 1."],["Supernova","A ship cannot move through or into a supernova."],["Gravity Rift","A ship that moves through or out of a gravity rift applies +1 to its move value and then rolls one die; on a result of 1-3, the ship is destroyed."]]],"retreat":["Retreat","During space combat, a player may announce a retreat during the Announce Retreat step. The retreat occurs at the end of that combat round. To retreat, the player moves all ships to an adjacent system that does not contain another player's ships and contains either a planet he controls or one of his units. If the destination system does not contain one of his command tokens, he must place one from reinforcements. Ground forces on planets that the retreating player wants to bring must be moved to the space area during the announce step.",[]],"frequently-overlooked-rules":["Frequently Overlooked Rules","Key rules often missed: Players do not resolve the agenda phase until any player has removed the custodians token from Mecatol Rex. Players cannot pass until they have performed a strategic action. Players cannot use the secondary ability of their own strategy cards. Players can produce at space docks in the active system even without moving or invading. Ships can only drop off ground forces in the active system. Players can exceed capacity during combat (excess destroyed after). Players are limited to 2 PDS and 1 space dock per planet. Unit upgrade tech does not satisfy prerequisites. Only one promissory note per transaction. Upgraded PDS in a system with a wormhole can fire through the wormhole. Maximum 3 secret objectives total.",[]],"custodians-of-mecatol-rex":["Custodians of Mecatol Rex","The custodians token represents caretakers that safeguard Mecatol Rex. Players may move ships into the Mecatol Rex system freely, but cannot land ground forces while the custodians token is present. To remove it, the active player must spend 6 influence immediately before landing ground forces. When removed, the player places it in his play area and gains 1 victory point. This also triggers the addition of the agenda phase to each subsequent game round.",[]],"agenda-types":["Agenda Types","Agendas are either directives or laws. Directives resolve the winning outcome and are discarded immediately. Laws with a 'For' outcome or elections become permanent (placed in common play area). Laws with an 'Against' outcome resolve the text and are discarded. Vote types: 'For or Against', 'Elect Player', or 'Elect Planet'.",[]],"speaker":["Speaker","The speaker is determined randomly at the start of the game. The speaker goes first during the strategy phase, reveals public objectives, draws agendas, and breaks ties during agenda voting. The speaker token can change hands through the Politics strategy card.",[]],"three-four-player-rules":["Three and Four Player Rules","In 3-4 player games: each player chooses a second strategy card during the strategy phase (in a second clockwise pass). A player's lowest-numbered strategy card determines initiative order. A player cannot pass until both strategy cards are exhausted.",[]],"imperium-rex":["Imperium Rex","The game can end early if no player has scored 10 victory points and there are no more objectives to reveal. When the speaker would reveal an objective but cannot, the game immediately ends and the player with the most victory points wins. If tied, the tied player earliest in initiative order wins.",[]],"mech-units":["Mech Units","Mechs are highly specialized faction-specific ground forces. Each player starts with their mech unit card in play. Mechs are produced like other units and are available from the beginning of the game. Mechs are a type of ground force — they can be transported and participate in ground combat. Each faction's mechs have unique stats and abilities shown on their mech unit card. Mech unit cards are not technology cards.",[]],"deploy":["Deploy","Some mech unit cards and other components have a 'Deploy' ability. Deploy abilities provide an alternative way to place units on the game board without using normal production. These abilities can only be resolved to place a unit that is in a player's reinforcements, and each deploy ability can be resolved only once per timing window.",[]],"exploration":["Exploration","When a player takes control of a planet that is not already controlled by another player, they explore that planet. To explore, draw a card from the exploration deck matching that planet's type (cultural, industrial, or hazardous) and resolve its effect. The card is then discarded unless it is a relic fragment or has an 'Attach' ability. Planets without a type cannot be explored. If a player gains control of multiple planets at the same time, they choose the order to explore them, resolving each card before exploring the next planet.",[["Frontier Tokens","During setup, a frontier token is placed in each non-home system that does not contain planets, including anomalies. Players with the 'Dark Energy Tap' technology can explore frontier tokens. When explored, the frontier token is discarded and a card is drawn from the frontier exploration deck. If an ability instructs a player to explore a frontier token, they may do so even without 'Dark Energy Tap'."],["Attached Cards","When a player draws an exploration card with the 'Attach' header, they attach it to the explored planet's card by sliding it underneath. The matching attachment token is placed on that planet on the game board. That planet is modified by the card's values and abilities. Attached cards remain attached if another player takes control of that planet."],["Relic Fragments and Relics","When a player draws an exploration card containing 'relic fragment' in the title, they place it faceup in their play area. Three relic fragments of the same type (cultural, industrial, hazardous, or frontier) can be purged to gain a relic. When gaining a relic, draw a card from the relic deck and place it faceup in the play area. Relic fragments can be exchanged as part of a transaction, but relics cannot."]]],"leaders":["Leaders","Each faction has three leaders with unique abilities. Leaders are placed on corresponding leader sheet slots during setup, showing their slot icon side. There are three types of leaders: Agent, Commander, and Hero.",[["Agent","Each agent ability exhausts that leader card when used. Agents are readied along with all other exhausted cards during the 'Ready Cards' step of the status phase. Agent abilities are available from the beginning of the game."],["Commander","Each commander has a passive ability that begins the game locked. Each commander card has an unlock goal (e.g., 'Have 3 scored objectives'). When the goal is fulfilled, the player flips the card to unlock the ability. A commander's ability can be shared with another faction by trading the 'Alliance' promissory note."],["Hero","Each hero has an exceptionally powerful, once-per-game ability that begins the game locked. Each hero card has an unlock goal. When fulfilled, the player flips the card and the ability becomes available. After using a hero's ability, the hero card is purged."]]],"purge":["Purge","If an ability instructs a player to purge a component, that component is removed from the game permanently and returned to the game box. Purged components cannot be used again for the remainder of the game.",[]],"capture":["Capture","Some abilities instruct a player to capture a unit, placing it on the capturing player's faction sheet until returned. If at least one of a player's space docks is being blockaded, they cannot capture units from the player who is blockading them.",[["Capturing Non-Fighter Ships and Mechs","Captured non-fighter ships and mechs are placed on the capturing player's faction sheet. They can be returned if: the capturing player agrees as part of a transaction, an ability allows returning them, or the captured player blockades a space dock of the capturing player. When returned, they are placed in the reinforcements of their original owner."],["Capturing Fighters and Ground Forces","Captured fighters and ground forces are returned to their reinforcements, and the capturing player places a fighter or infantry token from the supply on their faction sheet instead. These captured tokens do not belong to any player color, cannot be returned via transaction or blockade, and remain on the faction sheet until an ability returns them. When returned, they are placed in the supply."]]],"legendary-planets":["Legendary Planets","Some planets are legendary planets, indicated by the legendary icon on their system tile. When a player takes control of a legendary planet, they also place its legendary planet ability card in their play area. Each legendary planet ability card has a unique ability that can be used at the end of that player's turn. If a player gains control of an exhausted legendary planet ability card, it remains exhausted.",[]],"gamma-wormholes":["Gamma Wormholes","Prophecy of Kings introduces gamma wormholes in addition to the base game's alpha and beta wormholes. Like other wormholes, systems containing gamma wormholes are adjacent to all other systems containing gamma wormholes. Three generic gamma wormhole tokens and one Creuss-specific gamma wormhole token are included. The Ghosts of Creuss receive their Creuss gamma wormhole token as an additional component.",[]]};
var RSEL={"core":["object-of-the-game","game-round","command-tokens","units","unit-abilities","capacity","fleet-pool","reinforcements","planets","exhausted-and-readied","spending-resources-and-influence","technology","objectives","trade-goods-and-commodities","neighbors-and-transactions","action-cards","promissory-notes"],"strategy":["strategic-action"],"action":["tactical-action","strategic-action","component-action","wormholes","anomalies","retreat","frequently-overlooked-rules","mech-units","deploy","exploration","legendary-planets","three-four-player-rules"],"status":["custodians-of-mecatol-rex","speaker","imperium-rex"],"agenda":["agenda-types","custodians-of-mecatol-rex","speaker"],"combat":["tactical-action","anomalies","retreat","frequently-overlooked-rules","mech-units"]};

/* ---------- layout presets ---------- */
var TRI_OUTER=[21,22,23,27,28,29,33,34,35];
function triOff(){var o={};POS.forEach(function(p){if(p.ring===3&&TRI_OUTER.indexOf(p.i)<0)o[p.i]=1;});return o;}
function layoutId(){
  var ks=Object.keys(G.off).map(Number).sort(function(a,b){return a-b;});
  if(G.rings===2&&!ks.length)return 'ring2';
  if(G.rings===3&&!ks.length)return 'full';
  if(G.rings===3&&JSON.stringify(ks)===JSON.stringify(Object.keys(triOff()).map(Number).sort(function(a,b){return a-b;})))return 'tri';
  return 'custom';
}

/* ---------- state ---------- */
function mkPlayer(id,name,color,claude){return {id:id,name:name,color:color,faction:'',claude:!!claude,vp:0,tg:0,co:0,cmd:{t:3,f:3,s:2},ac:0,so:0,techs:[],passed:false};}
function newGame(){
  var strat={};for(var n=1;n<=8;n++)strat[n]={pid:null,ex:false};
  return {v:1,gid:Math.random().toString(36).slice(2,10),obj:{pub:[],cust:null},agenda:{cur:null,laws:[],done:[]},snaps:[],strategy:'',agdMode:'app',packs:{pok:false},rings:3,off:{},used:{},mapSetup:null,round:1,phase:'setup',active:null,speaker:'p1',np:4,
    players:[mkPlayer('p1','Player 1','red'),mkPlayer('p2','Player 2','blue'),mkPlayer('p3','Claude','green',true)],
    strat:strat,map:{},log:[],hidden:{}};
}
function blankSys(){return {tile:'',type:'system',wh:'',home:null,space:{},dm:{},cmd:[],planets:[]};}
function normalize(g){
  var b=newGame();
  g.packs=g.packs||b.packs;g.round=g.round||1;g.phase=PH[g.phase]?g.phase:'setup';g.np=g.np||10;
  g.strat=g.strat||b.strat;for(var n=1;n<=8;n++)g.strat[n]=g.strat[n]||{pid:null,ex:false};
  g.map=g.map||{};g.log=g.log||[];g.hidden=g.hidden||{};g.rings=g.rings===2?2:3;g.off=g.off||{};g.used=g.used||{};g.mapSetup=g.mapSetup||null;g.gid=g.gid||Math.random().toString(36).slice(2,10);g.obj=g.obj||{pub:[],cust:null};g.agenda=g.agenda||{cur:null,laws:[],done:[]};g.snaps=g.snaps||[];g.strategy=g.strategy||'';g.agdMode=g.agdMode||'app';
  g.players=(g.players||[]).map(function(p){var m=mkPlayer(p.id,p.name,p.color,p.claude);for(var k in p)m[k]=p[k];m.cmd=p.cmd||m.cmd;m.techs=p.techs||[];return m;});
  for(var i in g.map){var s=g.map[i],bs=blankSys();for(var k in bs)if(s[k]===undefined)s[k]=bs[k];s.dm=s.dm||{};s.planets.forEach(function(pl){pl.u=pl.u||{};pl.dm=pl.dm||{};});}
  return g;
}
function load(){try{var t=localStorage.getItem(KEY);if(t)return normalize(JSON.parse(t));}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}if(typeof syPush==='function')syPush();}
var G=load()||newGame();
var ui={tab:'map',layout:false,zoom:1,sheet:null,open:{},pick:null,arm:null,toast:'',io:'',resetY:false};

/* ---------- tile fill and random map ---------- */
function fillTile(s){
  var t=TILEDB[s.tile];if(!t)return false;
  s.type=t.ty;s.wh=t.wh||'';
  s.planets=t.pl.map(function(p){return {name:p[0],res:p[1],inf:p[2],tr:p[3]||'',sp:p[4]||'',lg:p[5]?1:0,owner:null,ex:false,u:{}};});
  return true;
}
function placeTile(i,tn,pid){var s=ens(i);s.tile=String(tn);fillTile(s);s.home=pid||null;}
function genMap(){
  var n=G.players.length;
  if(n<3||n>6){toast('Random maps cover 3 to 6 players. This game has '+n+'.');return false;}
  if(G.players.some(function(p){return !HOMEOF[p.faction];})){toast('Choose a faction for every player first (Setup, Players).');return false;}
  var seen={},dup=false;G.players.forEach(function(p){if(seen[p.faction])dup=true;seen[p.faction]=1;});
  if(dup){toast('Two players have the same faction.');return false;}
  var key=(G.packs.pok?'pok':'base')+n,list=SETUPS[key];
  var used=(G.used[key]||[]).slice();
  var avail=list.map(function(_,i){return i;}).filter(function(i){return used.indexOf(i)<0;});
  if(!avail.length){used=[];avail=list.map(function(_,i){return i;});}
  var pick=avail[Math.floor(Math.random()*avail.length)];used.push(pick);G.used[key]=used;
  G.rings=3;G.off=n===3?triOff():{};G.map={};
  placeTile(0,18);
  G.players.forEach(function(p,ix){placeTile(HOMES[n][ix],HOMEOF[p.faction],p.id);});
  list[pick].t.forEach(function(tn,ix){placeTile(OTHER[n][ix],tn);});
  G.players.forEach(function(q){q.techs=[];q.pend='';});
  applyStart();
  var bonusTxt='',BONUS=HOME_TG[n]||{},bl=[];
  G.players.forEach(function(p,ix){p.tg=Math.max(0,p.tg-(p.mapTg||0));var b=BONUS[HOMES[n][ix]]||0;p.mapTg=b;if(b){p.tg+=b;bl.push(p.name+' +'+b);}});
  if(bl.length){log('Five-player rule: extra starting trade goods for the weaker home positions: '+bl.join(', '));bonusTxt=' Five-player bonus trade goods: '+bl.join(', ')+'.';}
  G.mapSetup={key:key,n:pick+1,b:list[pick].b};
  log('Random map: setup '+(pick+1)+' of '+list.length+' ('+(G.packs.pok?'base game and Prophecy of Kings':'base game')+', '+n+' players)');
  var cr=G.players.filter(function(p){return p.faction==='creuss';})[0];
  toast('Map ready: setup '+(pick+1)+' of '+list.length+'.'+' Starting units and technology are placed.'+bonusTxt+(cr?' '+cr.name+' keeps the Creuss home system (tile 51) off the board; open it from the Map tab.':''));
  return true;
}

/* ---------- starting position ---------- */
function homeSlotOf(p){
  if(p.faction==='creuss')return 99;
  for(var i in G.map){if(+i!==99&&G.map[i].home===p.id&&G.map[i].type==='home')return +i;}
  return null;
}
function placeStart(p){
  var f=FSTART[p.faction];if(!f)return false;
  var slot=homeSlotOf(p);if(slot===null)return false;
  if(slot===99&&!G.map[99])placeTile(99,51,p.id);
  var s=ens(slot);if(slot===99)s.home=p.id;
  s.space[p.id]={};
  var main=null;
  s.planets.forEach(function(pl){pl.owner=p.id;pl.u=pl.u||{};delete pl.u[p.id];if(!main||pl.res>main.res||(pl.res===main.res&&pl.inf>main.inf))main=pl;});
  for(var id0 in f.u){
    var id=(p.faction==='saar'&&id0==='dock')?'ffactory':id0;
    var un=UNITS.filter(function(x){return x.id===id;})[0];if(!un)continue;
    if(un.k==='space'||un.k==='ground')s.space[p.id][id]=f.u[id0];
    else if(main){main.u[p.id]=main.u[p.id]||{};main.u[p.id][id]=f.u[id0];}
  }
  if(!Object.keys(s.space[p.id]).length)delete s.space[p.id];
  (f.t||[]).forEach(function(tid){
    var t=FTECH[tid];if(t&&!p.techs.some(function(x){return x.n===t[0];}))p.techs.push({n:t[0],c:t[1],ex:false});
  });
  if(f.p)p.pend=f.p;
  return true;
}
function applyStart(){
  var done=[],multi=false;
  G.players.forEach(function(p){if(placeStart(p)){done.push(p.name);var sl=homeSlotOf(p);if(sl!==null&&G.map[sl]&&G.map[sl].planets.length>1)multi=true;}});
  return {done:done,multi:multi};
}

/* ---------- helpers ---------- */
var $=function(s,e){return (e||document).querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var P=function(id){return G.players.filter(function(p){return p.id===id;})[0];};
var pn=function(id){var p=P(id);return p?p.name:'?';};
var col=function(p){return COLORS[p.color]||'#888';};
var packOk=function(o){return !o.pack||G.packs[o.pack];};
var unitsOf=function(kinds){return UNITS.filter(function(u){return kinds.indexOf(u.k)>=0&&packOk(u);});};
var lum=function(c){var n=parseInt(c.slice(1),16);return .299*(n>>16)+.587*((n>>8)&255)+.114*(n&255);};
var sum=function(o){var t=0;for(var k in (o||{}))t+=o[k];return t;};
function ens(i){if(!G.map[i])G.map[i]=blankSys();return G.map[i];}
function bump(o,k,d){o[k]=Math.max(0,(o[k]||0)+d);if(!o[k])delete o[k];}
function clone(x){return JSON.parse(JSON.stringify(x||blankSys()));}
function init(pid){var m=99;for(var n in G.strat){if(G.strat[n].pid===pid)m=Math.min(m,+n);}return m;}
function seatsFromSpeaker(){var ids=G.players.map(function(p){return p.id;}),k=Math.max(0,ids.indexOf(G.speaker));return ids.slice(k).concat(ids.slice(0,k));}
function order(){
  if(G.phase==='action'||G.phase==='status'){
    return G.players.map(function(p,ix){return {id:p.id,n:init(p.id),ix:ix};}).sort(function(a,b){return a.n-b.n||a.ix-b.ix;}).map(function(o){return o.id;});
  }
  if(G.phase==='agenda'){var sf=seatsFromSpeaker();return sf.slice(1).concat(sf.slice(0,1));}
  return seatsFromSpeaker();
}
function usage(pid){
  var u={};
  for(var i in G.map){var s=G.map[i];
    var sp=s.space[pid]||{};for(var k in sp)u[k]=(u[k]||0)+sp[k];
    s.planets.forEach(function(pl){var g=(pl.u||{})[pid]||{};for(var k in g)u[k]=(u[k]||0)+g[k];});}
  return u;
}
function owned(pid){var o=[];for(var i in G.map){G.map[i].planets.forEach(function(pl,ix){if(pl.owner===pid)o.push({i:+i,ix:ix,pl:pl});});}return o;}
function toast(m){ui.toast=m;clearTimeout(toast.t);toast.t=setTimeout(function(){ui.toast='';render();},2600);}

/* ---------- log ---------- */
function log(s){G.log.unshift({t:Date.now(),r:G.round,ph:G.phase,by:G.active,s:s});if(G.log.length>500)G.log.length=500;}
var LBL={vp:'VP',tg:'Trade goods',co:'Commodities',ac:'Action cards',so:'Secret objectives',ct:'Tactic tokens',cf:'Fleet tokens',cs:'Strategy tokens'};
function logDelta(pid,k,d){
  var key=pid+':'+k,now=Date.now(),l=G.log[0];
  if(l&&l.key===key&&now-l.t<12000){l.d+=d;l.t=now;if(l.d===0){G.log.shift();return;}}
  else{G.log.unshift({t:now,r:G.round,ph:G.phase,by:G.active,key:key,d:d,who:pn(pid),lbl:LBL[k]});}
}
function entryText(e){return e.s||(e.who+': '+e.lbl+' '+(e.d>0?'+':'−')+Math.abs(e.d));}
function uDiff(b,a,pid){var ch=[];UNITS.forEach(function(u){var d=((a[pid]||{})[u.id]||0)-((b[pid]||{})[u.id]||0);if(d)ch.push((d>0?'+':'−')+Math.abs(d)+' '+u.n);});return ch;}
function diffSys(b,a){
  var out=[];
  if(b.tile!==a.tile)out.push(a.tile?'tile '+a.tile:'tile cleared');
  G.players.forEach(function(p){
    var ch=uDiff(b.space,a.space,p.id);if(ch.length)out.push(p.name+' '+ch.join(', '));
    var was=b.cmd.indexOf(p.id)>=0,is=a.cmd.indexOf(p.id)>=0;
    if(was!==is)out.push(p.name+(is?' activated it':' token removed'));
  });
  a.planets.forEach(function(pl){
    var bp=b.planets.filter(function(x){return x.name===pl.name;})[0];
    if(!bp)out.push('planet '+pl.name+' added'+(pl.owner?' (taken by '+pn(pl.owner)+')':''));
    else{
      if(bp.owner!==pl.owner)out.push(pl.name+' → '+(pl.owner?pn(pl.owner):'unclaimed'));
      if(bp.ex!==pl.ex)out.push(pl.name+(pl.ex?' exhausted':' readied'));
    }
    G.players.forEach(function(p){var ch=uDiff((bp||{}).u||{},pl.u||{},p.id);if(ch.length)out.push(pl.name+': '+p.name+' '+ch.join(', '));});
  });
  b.planets.forEach(function(bp){if(!a.planets.some(function(x){return x.name===bp.name;}))out.push('planet '+bp.name+' removed');});
  return out;
}
function closeSheet(){
  var i=ui.sheet.i,a=G.map[i]||blankSys(),d=diffSys(ui.sheet.before,a);
  if(d.length)log('Slot '+i+(a.tile?' (tile '+a.tile+')':'')+': '+d.join('; '));
  ui.sheet=null;
}

/* ---------- turn flow ---------- */
function endStatus(){
  for(var i in G.map)G.map[i].planets.forEach(function(pl){pl.ex=false;});
  for(var n in G.strat)G.strat[n]={pid:null,ex:false};
  G.players.forEach(function(p){p.techs.forEach(function(t){t.ex=false;});});
}
function setPhase(ph){
  var prev=G.phase;if(ph===prev)return;
  G.tac=null;G.sa=null;
  if(prev==='status'){snapshot();endStatus();}
  if(ph==='strategy'&&(prev==='status'||prev==='agenda'))G.round++;
  G.phase=ph;
  if(ph==='status')statusHooks();
  G.players.forEach(function(p){p.passed=false;});
  G.active=ph==='strategy'?(nextPicker()||order()[0]||null):(order()[0]||null);
  log('Round '+G.round+': '+PH[ph]+' phase begins');
}
function advance(pass){
  G.tac=null;ui.claudeCommit=null;
  var o=order();if(!o.length)return;
  if(pass&&G.active){P(G.active).passed=true;log(pn(G.active)+' passed');}
  var idx=o.indexOf(G.active),found=null;
  for(var n=1;n<=o.length;n++){var pid=o[(idx+n)%o.length];if(G.phase!=='action'||!P(pid).passed){found=pid;break;}}
  G.active=found;
  if(G.phase==='action'&&!found){setPhase('status');toast('Everyone has passed. The status phase begins.');}
}

    if(s.type==='home'&&s.home&&P(s.home))tint='<polygon class="tint" points="'+HEXPTS+'" style="color:'+col(P(s.home))+'"/>';
    else if(s.type!=='system'&&s.type!=='empty'&&s.type!=='home')tint='<polygon class="tint tt-'+s.type+'" points="'+HEXPTS+'"/>';
    var x='';

    });
    var cs=[];G.players.forEach(function(pp){var sq=s.space[pp.id]||{},n=sum(sq)-(sq.infantry||0)-(sq.mech||0);if(n>0)cs.push({p:pp,n:n});});
    cs.slice(0,4).forEach(function(c,ix,arr){
      var cx=-arr.length*10+ix*20+1;
      x+='<rect class="hx-chip" x="'+cx+'" y="13" width="18" height="13" rx="3" fill="'+col(c.p)+'"/><text class="hx-cn" x="'+(cx+9)+'" y="23" fill="'+(lum(col(c.p))>150?'#111':'#fff')+'">'+c.n+'</text>';
    });
    s.cmd.forEach(function(pid,ix,arr){
      var pp=P(pid);if(!pp)return;var cx=-arr.length*6+ix*12+6;
      x+='<rect x="'+(cx-3.5)+'" y="28.5" width="7" height="7" fill="'+col(pp)+'" transform="rotate(45 '+cx+' 32)" stroke="var(--ink)" stroke-width=".8"/>';

  });
  var bx0=1e9,bx1=-1e9,by0=1e9,by1=-1e9;POS.forEach(function(p){if(p.ring>G.rings||(G.off[p.i]&&!ui.layout))return;bx0=Math.min(bx0,p.x);bx1=Math.max(bx1,p.x);by0=Math.min(by0,p.y);by1=Math.max(by1,p.y);});if(bx0>bx1){bx0=bx1=by0=by1=0;}var vx=bx0-S-6,vy=by0-S*.87-6,vw=bx1-bx0+2*S+12,vh=by1-by0+S*1.74+12;return '<svg viewBox="'+vx.toFixed(0)+' '+vy.toFixed(0)+' '+vw.toFixed(0)+' '+vh.toFixed(0)+'" style="width:'+(ui.zoom*100)+'%" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Galaxy map">'+g+'</svg>';

    case 'ctr':p=P(d.p);var lim={vp:[0,20]}[d.k]||[0,99],nv=Math.min(lim[1],Math.max(lim[0],p[d.k]+(+d.d)));if(nv!==p[d.k]){logDelta(p.id,d.k,nv-p[d.k]);p[d.k]=nv;}break;

      var kr=G.rings,ko=G.off,ku=G.used;G=newGame();G.rings=kr;G.off=ko;G.used=ku;G.players=keep;G.packs=pk;G.np=np;G.speaker=sp;ui.undo=[];ui.cr=null;ui.combat=null;ui.debrief='';toast('New game started.');break;
    default:var xr=ext(a,d,el,ev);if(!xr)return;if(xr===2){render();return;}break;

function chg(a,d,el){

function groundIn(u){return ((u||{}).infantry||0)+((u||{}).mech||0);}
function isMecatolPlanet(pl){return /mecatol rex/i.test(pl.name);}
function takeCustodians(pid){

function commitInfo(i,ix){
  var T=G.tac;if(!T||T.slot!==i||T.pid!==G.active)return null;
  var s=G.map[i];if(!s)return null;
  var pl=s.planets[ix];if(!pl||pl.owner===T.pid)return null;
  if(ui.combat||ui.pre||ui.tac)return null;
  if(G.players.some(function(q){return q.id!==T.pid&&hasShips(s,q.id);}))return null;
  var sp=s.space[T.pid]||{},inf=sp.infantry||0,mech=sp.mech||0;
  if(inf+mech<1)return null;
  return {pid:T.pid,inf:inf,mech:mech};
}
function shiftUnits(srcU,srcDm,dstU,dstDm,u,n){
  var have=srcU[u]||0;n=Math.min(n,have);if(!n)return 0;
  var dam=(srcDm&&srcDm[u])||0,moveDam=Math.max(0,dam-(have-n));
  srcU[u]=have-n;if(!srcU[u])delete srcU[u];
  if(srcDm&&dam){srcDm[u]=dam-moveDam;if(!srcDm[u])delete srcDm[u];}
  dstU[u]=(dstU[u]||0)+n;
  if(moveDam&&dstDm)dstDm[u]=(dstDm[u]||0)+moveDam;
  return n;
}
function commitUnits(pid,i,ix,want){
  var s=ens(i),pl=s.planets[ix],moved=[];
  s.space[pid]=s.space[pid]||{};s.dm=s.dm||{};s.dm[pid]=s.dm[pid]||{};
  pl.u=pl.u||{};pl.u[pid]=pl.u[pid]||{};pl.dm=pl.dm||{};pl.dm[pid]=pl.dm[pid]||{};
  ['infantry','mech'].forEach(function(u){var n=shiftUnits(s.space[pid],s.dm[pid],pl.u[pid],pl.dm[pid],u,want[u]||0);if(n)moved.push(n+' '+uname(u));});
  if(!Object.keys(s.space[pid]).length)delete s.space[pid];
  if(!Object.keys(s.dm[pid]).length)delete s.dm[pid];
  if(!Object.keys(pl.dm[pid]).length)delete pl.dm[pid];
  return moved;
}
function gainControl(pid,i,ix){
  var pl=G.map[i].planets[ix],old=pl.owner,lost=[];
  pl.owner=pid;pl.ex=true;
  G.players.forEach(function(q){
    if(q.id===pid)return;var u=pl.u&&pl.u[q.id];if(!u)return;
    ['pds','dock'].forEach(function(k){if(u[k]){lost.push(q.name+'’s '+uname(k));delete u[k];}});
    Object.keys(u).forEach(function(k){if(!u[k])delete u[k];});
    if(!Object.keys(u).length)delete pl.u[q.id];
  });
  var extra='';
  if(P(pid).faction==='saar'){P(pid).tg+=1;extra=' Scavenge: +1 trade good.';}
  log(pn(pid)+' gained control of '+pl.name+(old&&old!==pid?' from '+pn(old):'')+'. The planet card is exhausted.'+(lost.length?' Destroyed: '+lost.join(', ')+'.':'')+extra);
  toast(pn(pid)+' now controls '+pl.name+' (exhausted).'+extra);
}
function resolveInvasion(i,ix,pid){
  var s=G.map[i],pl=s.planets[ix];
  var foes=G.players.filter(function(q){return q.id!==pid&&(groundIn((pl.u||{})[q.id])>0||(((pl.u||{})[q.id]||{}).pds||0)>0);});
  if(!foes.length){gainControl(pid,i,ix);return;}
  var withG=foes.filter(function(q){return groundIn((pl.u||{})[q.id])>0;}),def=(withG[0]||foes[0]).id;
  cbStart(i,pid,def,{});
  var c=ui.combat;c.pl=ix;c.noSpace=false;c.inv={pid:pid,i:i,ix:ix};
}
function invasionEnd(inv){
  var s=G.map[inv.i],pl=s&&s.planets[inv.ix];if(!pl)return;
  var mine=groundIn((pl.u||{})[inv.pid]);
  var theirs=G.players.some(function(q){return q.id!==inv.pid&&groundIn((pl.u||{})[q.id])>0;});
  if(mine>0&&!theirs)gainControl(inv.pid,inv.i,inv.ix);
  else if(!mine&&!theirs)log('Nobody has ground forces left on '+pl.name+', so '+(pl.owner?pn(pl.owner)+' keeps control of it':'it stays uncontrolled')+'.');
}
function cbGroundPre(c,side,mk){
  var s=G.map[c.i]||blankSys(),pl=s.planets[c.pl];if(!pl)return;
  if(side==='a'){
    if(!groundIn((pl.u||{})[c.d]))return;
    var shield=G.players.some(function(q){return q.id!==c.a&&(((pl.u||{})[q.id]||{}).pds||0)>0;}),sp=s.space[c.a]||{},dn=sp.dreadnought||0,ws=sp.warsun||0;
    if(dn&&!shield){var d2=ustat(c.a,'dreadnought');mk('bombdn','Bombardment (Dreadnought)',dn,dn*d2.bomb[1],d2.bomb[0],'Hits can only destroy ground forces on this planet.');}
    if(ws){var w2=ustat(c.a,'warsun');mk('bombws','Bombardment (War Sun)',ws,ws*w2.bomb[1],w2.bomb[0],'Hits can only destroy ground forces. A war sun ignores planetary shield.');}
  }else{
    var pds=(((pl.u||{})[c.d]||{}).pds)||0;
    if(pds){var ps=ustat(c.d,'pds');mk('scd','Space cannon defense (PDS)',pds,pds*ps.sc[1],ps.sc[0],'Hits can only destroy ground forces committed to this planet.');}
  }
}

function commitGo(){
  var C=ui.commit;if(!C)return;
  var ci=commitInfo(C.i,C.pl);if(!ci){ui.commit=null;return;}
  var s=ens(C.i),pl=s.planets[C.pl],pid=ci.pid,want={infantry:Math.min(C.n.infantry,ci.inf),mech:Math.min(C.n.mech,ci.mech)};
  if(want.infantry+want.mech<1){toast('Choose at least one ground force to land.');return;}
  var cust=isMecatolPlanet(pl)&&!G.obj.cust;
  if(cust&&!C.cust){toast('Tick the box once the 6 influence has been spent.');return;}
  if(cust)takeCustodians(pid);
  var moved=commitUnits(pid,C.i,C.pl,want);

function finishDeferred(){if(G.sa)return;if(ui.deferAdvance){var dv=ui.deferAdvance;ui.deferAdvance=null;advance(dv.pass);}}
function tacContinue(){
  if(ui.combat||ui.pre)return;
  if(ui.claudeCommit&&ui.claudeCommit.length){runClaudeCommit();return;}
  ui.claudeCommit=null;finishDeferred();
}
function runClaudeCommit(){
  var cp=claudeP(),T=G.tac;
  if(!cp||!T){ui.claudeCommit=null;finishDeferred();return;}
  var list=ui.claudeCommit||[];
  while(list.length){
    var cm=list.shift(),s=G.map[T.slot],pl=s&&s.planets[cm.ix];if(!pl||pl.owner===cp.id)continue;
    var sp=s.space[cp.id]||{},want={infantry:Math.min(cm.units.infantry||0,sp.infantry||0),mech:Math.min(cm.units.mech||0,sp.mech||0)};
    if(!want.infantry&&!want.mech){log('Claude had no ground forces left to land on '+pl.name);continue;}
    var rm=isMecatolPlanet(pl)&&!G.obj.cust;if(rm){takeCustodians(cp.id);toast('Claude spends 6 influence to remove the Custodians token: exhaust its planets worth 6 influence.');}
    var moved=commitUnits(cp.id,T.slot,cm.ix,want);
    log('Claude committed '+moved.join(', ')+' to '+pl.name);
    resolveInvasion(T.slot,cm.ix,cp.id);
    if(ui.combat){save();render();return;}
  }
  ui.claudeCommit=null;save();render();finishDeferred();
}

function ext6(a,d,el,ev){

      var ci=commitInfo(+d.i,+d.pl);

/* ====================== strategic actions: primary, then every other player may resolve the secondary ====================== */
function saOthers(pid){var ids=G.players.map(function(p){return p.id;}),k=ids.indexOf(pid);return ids.slice(k+1).concat(ids.slice(0,k));}
function saName(n){return STRATD[n-1][0];}
function saBegin(n){
  var h=G.strat[n].pid;G.strat[n].ex=true;
  G.sa={n:n,pid:h,step:'primary',others:saOthers(h),i:0,j:0,joined:[],asked:{},busy:false};
  ui.saNotes={};
  log(pn(h)+' took a strategic action with '+saName(n)+' (initiative '+n+')');
}
function saClick(n){
  var h=G.strat[n]&&G.strat[n].pid;if(!h)return;
  if(G.sa){toast('Finish the current strategic action first.');return;}
  if(G.strat[n].ex){ui.confirm={t:saName(n)+' is already used',m:'Mark it as unused again? Only do this to fix a mistake.',ok:'Mark unused',act:'saUnuse',n:n};return;}
  if(G.phase!=='action'){ui.alert={t:'Strategic actions',m:'A strategy card’s primary and secondary abilities are used on its holder’s turn in the action phase.'};return;}
  if(G.active!==h){ui.alert={t:'It is not '+pn(h)+'’s turn',m:'Only the holder can take a strategic action, and only on their own turn. Tap their name at the top first if the turn marker is wrong.'};return;}
  if(P(h).passed){ui.alert={t:pn(h)+' has passed',m:'A player who has passed cannot take another action.'};return;}
  saBegin(n);saEnter();
}
function saEnter(){
  var S=G.sa;if(!S)return;
  if(S.step==='decide'){
    if(S.i>=S.others.length){S.step='resolve';S.j=0;if(!S.joined.length)saFinish();return;}
    var q=P(S.others[S.i]);
    if(q&&q.claude&&ui.sample&&hGet()&&!S.asked[q.id]){S.asked[q.id]=1;setTimeout(saAskClaude,0);}
  }
}
function saPrimaryDone(){var S=G.sa;if(!S||S.step!=='primary')return;log(pn(S.pid)+' resolved the primary ability of '+saName(S.n));S.step='decide';S.i=0;saEnter();}
function saYes(){
  var S=G.sa,pid=S&&S.others[S.i],p=P(pid);if(!p||S.step!=='decide')return;
  var cost=saCostsToken(S.n);
  if(cost&&p.cmd.s<1){toast(p.name+' has no command tokens in the strategy pool, so the secondary cannot be resolved.');return;}
  if(cost)p.cmd.s-=1;S.joined.push(pid);S.i++;
  log(p.name+' will resolve the secondary of '+saName(S.n)+(cost?' and spends 1 strategy token ('+p.cmd.s+' left)':' (no command token needed)'));
  saEnter();
}
function saNo(){
  var S=G.sa,pid=S&&S.others[S.i],p=P(pid);if(!p||S.step!=='decide')return;
  S.i++;log(p.name+' does not resolve the secondary of '+saName(S.n));saEnter();
}

function saFinish(){
  var S=G.sa;if(!S)return;var h=S.pid;

/* ====================== tech specialties (planets) and what a player can research ====================== */
var SPC={cybernetic:'yellow',propulsion:'blue',biotic:'green',warfare:'red'};
var CNAME={blue:'Blue',green:'Green',yellow:'Yellow',red:'Red'};
function specColor(sp){return SPC[sp]||sp;}
function techHave(p){
  var have={blue:0,green:0,yellow:0,red:0};
  p.techs.forEach(function(t){var m=TECHN[t.n.toLowerCase()];if(m&&(m[2]==='c'||m[2]==='f')&&have[m[3]]!==undefined)have[m[3]]++;});
  return have;
}
function techSkipPlanets(p){
  var out={};
  owned(p.id).forEach(function(o){if(o.pl.sp&&!o.pl.ex){var c=specColor(o.pl.sp);(out[c]=out[c]||[]).push(o.pl.name);}});
  return out;
}
function techReady(p,t,have,skips){
  var need={},used=[],short=[];
  t[4].forEach(function(x){need[x]=(need[x]||0)+1;});
  Object.keys(need).forEach(function(k){
    var m=Math.max(0,need[k]-(have[k]||0));if(!m)return;
    var av=skips[k]||[];
    if(av.length>=m)used=used.concat(av.slice(0,m));else short.push((m-av.length)+' '+k);
  });
  return {ok:!short.length,used:used,short:short};
}
function techResearchable(p){
  var own={},have=techHave(p),skips=techSkipPlanets(p),out=[];
  p.techs.forEach(function(t){own[t.n.toLowerCase()]=1;});
  TECH.forEach(function(t){
    if((t[7]&&!G.packs.pok)||own[t[1].toLowerCase()]||(t[6]&&t[6]!==p.faction))return;
    var r=techReady(p,t,have,skips);if(r.ok)out.push({t:t,used:r.used});
  });
  return out;
}
function techBonusHTML(p){
  var have=techHave(p),skips=techSkipPlanets(p),sp=owned(p.id).filter(function(o){return o.pl.sp;});
  var line=['blue','green','yellow','red'].map(function(c){
    var n=(skips[c]||[]).length;
    return CNAME[c]+' '+have[c]+(n?' <span title="ready planets with a '+c+' tech specialty">+'+n+' planet'+(n>1?'s':'')+'</span>':'');
  }).join(' · ');
  var h='<div class="small mut" style="margin-top:8px"><b>Prerequisites:</b> '+line+'</div>';
  if(!sp.length)return h+'<div class="small mut">No planets with a tech specialty yet.</div>';
  h+='<div class="small mut" style="margin-top:4px">Tech specialty planets. Exhaust one to ignore one prerequisite of its color when researching.</div><div class="tags">'+sp.map(function(o){
    var c=specColor(o.pl.sp),tc=(TECHC.filter(function(x){return x[0]===c;})[0]||TECHC[4])[2];
    return '<button class="tag'+(o.pl.ex?' ex':'')+'" style="--tc:'+tc+'" data-act="pex" data-i="'+o.i+'" data-pl="'+o.ix+'" aria-pressed="'+o.pl.ex+'"><span class="tcol"></span>'+esc(o.pl.name)+' · '+c+' · '+(o.pl.ex?'exhausted':'ready')+'</button>';
  }).join('')+'</div>';
  return h;
}
function techListText(cp){
  var out=[];
  techResearchable(cp).forEach(function(r){var t=r.t;
    out.push(t[1]+' ['+(t[2]==='u'?'unit upgrade':t[3])+(r.used.length?'; you must exhaust the tech specialty planet'+(r.used.length>1?'s':'')+' '+r.used.join(', ')+' to ignore a prerequisite':'')+']: '+t[5]);
  });
  return out.join('\n');
}

/* ====================== strategic action: what a player needs to know to decide ====================== */
function saCostsToken(n){var st=stratText(n-1);return !!st&&/token from your strategy pool/i.test(st.s);}
function saHints(q,n){
  var nm=saName(n).toLowerCase(),h=[],hh=hGet(),pls=owned(q.id),R=0,I=0,exh=[];
  pls.forEach(function(o){if(o.pl.ex)exh.push(o.pl.name);else{R+=o.pl.res;I+=o.pl.inf;}});
  if(nm==='leadership')h.push('Costs influence, not a command token: ready influence '+I+' + '+q.tg+' trade goods = up to '+Math.floor((I+q.tg)/3)+' command token'+(Math.floor((I+q.tg)/3)===1?'':'s')+' (3 influence each).');
  else if(nm==='diplomacy')h.push(exh.length?'Exhausted planets that could be readied (up to 2): '+exh.join(', ')+'.':'No exhausted planets, so there is nothing to ready.');
  else if(nm==='politics'&&hh)h.push('Action cards in hand: '+handOf(q.id).ac.length+' (drawing 2 more; the hand limit is 7).');
  else if(nm==='construction'){
    var docks=0,pds=0,bare=[];
    pls.forEach(function(o){var u=(o.pl.u||{})[q.id]||{};docks+=u.dock||0;pds+=u.pds||0;if(!u.dock&&!u.pds)bare.push(o.pl.name);});
    h.push('Space docks '+docks+' of 3, PDS '+pds+' of 6. Controlled planets with no structure: '+(bare.length?bare.join(', '):'none')+'.');
  }
  else if(nm==='trade'){var f=FSTART[q.faction],mx=f?f.c:null;if(mx!=null)h.push('Commodities '+q.co+' of '+mx+': replenishing gives '+Math.max(0,mx-q.co)+' more.');}
  else if(nm==='warfare'){
    var dk=pls.filter(function(o){return ((o.pl.u||{})[q.id]||{}).dock;}).map(function(o){return o.pl.name+' (up to '+(o.pl.res+2)+' units)';});
    h.push(dk.length?'Space docks you control: '+dk.join(', ')+'. Production needs resources: you have '+R+' ready + '+q.tg+' trade goods.':'You have no space dock, so there is nothing to produce with.');
  }
  else if(nm==='technology'){
    var rs=techResearchable(q),nms=rs.slice(0,8).map(function(r){return r.t[1];});
    h.push('Needs 4 resources: you have '+R+' ready + '+q.tg+' trade goods = '+(R+q.tg)+'.');
    h.push('Technologies you could research now: '+rs.length+(rs.length?' ('+nms.join(', ')+(rs.length>8?', …':'')+')':'')+'.');
  }
  else if(nm==='imperial'&&hh){var hd=handOf(q.id);h.push('Secret objectives held or scored: '+(hd.so.length+hd.pending.length+hd.scored.length)+' (the limit is 3).');}
  return h;
}
function saSummary(q,n){
  var pls=owned(q.id),R=0,I=0,rdy=[],exh=[];
  pls.forEach(function(o){
    if(o.pl.ex)exh.push(o.pl.name);
    else{R+=o.pl.res;I+=o.pl.inf;rdy.push(o.pl.name+' '+o.pl.res+'/'+o.pl.inf+(o.pl.sp?' ('+specColor(o.pl.sp)+' tech)':''));}

  h+='<div class="small" style="margin-top:6px"><b>Ready planets:</b> '+(rdy.length?esc(rdy.join(', ')):'none')+(exh.length?'<br><span class="mut"><b>Exhausted:</b> '+esc(exh.join(', '))+'</span>':'')+'</div>';
  var hs=null;for(var k in G.map){if(G.map[k].home===q.id){hs=+k;break;}}

  }

  if(hint.length)h+='<div class="note" style="margin-top:8px">'+hint.map(esc).join('<br>')+'</div>';

/* ---------- playbook ---------- */
function pbLoad(){try{var t=localStorage.getItem(PKEY);if(t){var p=JSON.parse(t);if(p&&Array.isArray(p.lessons))return p;}}catch(e){}return {lessons:[]};}

function words(s){return String(s).trim().split(/\s+/).filter(Boolean).length;}
function pbMatch(){
  var cp=claudeP(),tags={general:1};
  if(cp&&cp.faction)tags['faction:'+cp.faction]=3;
  if(G.strategy)tags['strategy:'+G.strategy]=3;
  G.players.forEach(function(p){if(!p.claude&&p.faction)tags['vs:'+p.faction]=2;});
  tags.general=1;return tags;
}
function pbSlice(){
  var tags=pbMatch(),sc=PB.lessons.map(function(l,ix){var s=0;(l.tags||[]).forEach(function(t){if(tags[t])s+=tags[t];});return {l:l,s:s,ix:ix};}).filter(function(x){return x.s>0;});

/* ---------- searchable picker (objectives, agendas, technology) ---------- */
function stratText(i){var s=STRATD[i];if(!s)return null;var o=G.packs.pok&&STRATPK[s[0].toLowerCase()];return {n:s[0],i:s[1],p:o?o[0]:s[2],s:o?o[1]:s[3]};}

function pickList(){
  var pk=ui.picker,q=(pk.q||'').toLowerCase().trim(),out=[],i;
  var hit=function(a,b){return !q||(a+' '+b).toLowerCase().indexOf(q)>=0;};
  if(pk.k==='obj'){
    var have={};G.obj.pub.forEach(function(o){have[o.id]=1;});
    OBJ.forEach(function(o){
      if(o[2]===0||(o[6]&&!G.packs.pok)||have[o[0]])return;
